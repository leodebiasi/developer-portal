  /econsigado/employee/clt-leads/{id}/proposal:
    post:
      tags:
        - Crédito Trabalhador
      summary: Enviar propostas a partir do lead
      description: |
        Envia as propostas à Dataprev a partir de um lead. O `proposal_request_id` vem do lead (não envie no body).

        O lead determina o que enviar: leads com `requires_guarantees: false` recebem uma
        proposta sem garantias; leads com `requires_guarantees: true` exigem duas propostas
        no mesmo request (uma com e outra sem garantias).

        Os valores de garantia não são escolha da instituição: use os campos não nulos de
        `requested_guarantee` no lead. Informar uma garantia que o trabalhador não ofereceu,
        ou omitir uma que ele ofereceu, resulta em `422`.
      operationId: createEConsignadoCltLeadProposal
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do lead
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EConsignadoCltLeadProposalRequest"
            examples:
              semGarantias:
                summary: Lead sem garantias (uma proposta)
                value:
                  proposals:
                    - proposal_number: PROP0001
                      proposal_valid_until: "23072026235959"
                      installments_count: 24
                      installment_amount: 250
                      released_amount: 5000
                      loan_amount: 5200
                      iof_amount: 15
                      annual_rate: 18
                      annual_cet: 21
                      monthly_rate: 1.5
                      monthly_cet: 1.75
                      contacts:
                        - type: 1
                          contact: trabalhador@exemplo.com
                      has_guarantees: false
              comGarantias:
                summary: Lead com garantias (duas propostas)
                description: |
                  O lead deste exemplo trouxe `requested_guarantee` com
                  `fgts_guarantee_balance: 1000` e `severance_penalty_guarantee_amount: 3000`,
                  e `severance_guarantee_percentage: null` — por isso o percentual não é enviado.
                value:
                  proposals:
                    - proposal_number: PROP0001
                      proposal_valid_until: "23072026235959"
                      installments_count: 24
                      installment_amount: 250
                      released_amount: 4000
                      loan_amount: 4000
                      iof_amount: 15
                      annual_rate: 18
                      annual_cet: 21
                      monthly_rate: 1.5
                      monthly_cet: 1.75
                      contacts:
                        - type: 1
                          contact: trabalhador@exemplo.com
                      has_guarantees: false
                    - proposal_number: PROP0001B
                      proposal_valid_until: "23072026235959"
                      installments_count: 24
                      installment_amount: 235
                      released_amount: 4000
                      loan_amount: 4000
                      iof_amount: 15
                      annual_rate: 14
                      annual_cet: 16.5
                      monthly_rate: 1.1
                      monthly_cet: 1.3
                      contacts:
                        - type: 1
                          contact: trabalhador@exemplo.com
                      has_guarantees: true
                      fgts_guarantee_balance: 1000
                      severance_penalty_guarantee_amount: 3000
      responses:
        "200":
          description: Proposta enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EConsignadoCltLeadProposalResponse"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Conta não habilitada ou scope insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "404":
          description: Lead não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "409":
          description: Já existe proposta para este lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "422":
          description: Lead expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "429":
          description: Limite de requisições excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "503":
          description: Serviço indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - econsignado.write
