    EConsignadoCltLeadStatus:
      type: string
      enum:
        - NEW
        - PROPOSAL_SENT
        - PROPOSAL_ACCEPTED
        - PROPOSAL_REJECTED
        - EXPIRED
      description: Status do lead no leilão CLT.
    EConsignadoCltLead:
      type: object
      description: Lead do leilão eConsignado CLT (visão da conta autenticada).
      properties:
        id:
          type: string
          format: uuid
        dataprev_request_id:
          type: integer
          description: idSolicitacao da Dataprev.
        worker_cpf:
          type: string
          pattern: ^[0-9]{11}$
        worker_name:
          type: string
          nullable: true
        employee_registration:
          type: string
          nullable: true
          description: Matrícula do trabalhador.
        employer_registration_number:
          type: string
          nullable: true
        employer_registration_type:
          type: integer
          nullable: true
          description: "Código eSocial/Dataprev: 1=CNPJ, 2=CPF, 3=CAEPF, 4=CNO."
        requested_amount:
          type: number
          nullable: true
        installments_count:
          type: integer
          nullable: true
        available_margin:
          type: number
          nullable: true
        loan_eligible:
          type: boolean
          nullable: true
        requires_guarantees:
          type: boolean
          description: |
            Quando `true`, o trabalhador pediu propostas com garantias e a instituição
            precisa enviar **duas** propostas no mesmo request (uma com e outra sem).
            Quando `false`, envie apenas uma proposta, sem garantias.
        requested_guarantee:
          allOf:
            - $ref: "#/components/schemas/EConsignadoRequestedGuarantee"
          nullable: true
          description: |
            Garantias que o trabalhador ofereceu na solicitação. `null` quando ele não
            pediu propostas com garantias. A proposta com garantias precisa informar
            exatamente os campos não nulos deste objeto.
        admission_date:
          type: string
          nullable: true
        request_valid_until:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/EConsignadoCltLeadStatus"
        proposal_sent_by_me:
          type: boolean
          description: Indica se você já enviou proposta neste lead.
        proposal_sent_at:
          type: string
          format: date-time
          nullable: true
        synced_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    EConsignadoCltLeadListRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        status:
          description: |
            Status único (legado) ou lista para filtro `IN`.
            Valores: `NEW`, `PROPOSAL_SENT`, `PROPOSAL_ACCEPTED`, `PROPOSAL_REJECTED`, `EXPIRED`.
          oneOf:
            - $ref: "#/components/schemas/EConsignadoCltLeadStatus"
            - type: array
              minItems: 1
              maxItems: 5
              items:
                $ref: "#/components/schemas/EConsignadoCltLeadStatus"
        filter:
          type: string
          minLength: 1
          maxLength: 100
          description: Busca textual por nome do trabalhador ou CPF (com ou sem máscara).
        created_at_from:
          type: string
          format: date-time
          description: Início da janela em `created_at` (inclusive).
        created_at_to:
          type: string
          format: date-time
          description: Fim da janela em `created_at` (inclusive). Se enviado com `created_at_from`, deve ser `>= from`.
        sort_by:
          type: string
          enum:
            - created_at
            - request_valid_until
            - proposal_sent_at
            - status
            - requested_amount
          default: created_at
          description: Campo de ordenação.
        sort_order:
          type: string
          enum:
            - asc
            - desc
          default: desc
          description: Direção da ordenação.
    EConsignadoCltLeadListResponse:
      type: object
      required:
        - data
        - page
        - per_page
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EConsignadoCltLead"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    EConsignadoProposalContact:
      type: object
      required:
        - type
        - contact
      properties:
        type:
          type: integer
          description: Tipo de contato conforme Dataprev.
        contact:
          type: string
          maxLength: 4000
    EConsignadoRequestedGuarantee:
      type: object
      description: |
        Garantias oferecidas pelo trabalhador na solicitação. Os campos que ele não
        ofereceu vêm como `null` e **não** devem constar na proposta.
      properties:
        fgts_guarantee_balance:
          type: number
          nullable: true
          description: Saldo do FGTS oferecido em garantia.
        severance_penalty_guarantee_amount:
          type: number
          nullable: true
          description: Multa rescisória do FGTS oferecida em garantia.
        severance_guarantee_percentage:
          type: number
          nullable: true
          description: Percentual da verba rescisória oferecido em garantia.
    EConsignadoCltLeadProposalRequest:
      type: object
      description: |
        Body do envio de propostas a partir do lead, com 1 ou 2 propostas.

        O `proposal_request_id` é obtido automaticamente do lead — não envie no body.
        `proposal_valid_until` no formato Dataprev `ddMMyyyyHHmmss` (horário de Brasília).

        O que enviar depende do campo `requires_guarantees` do lead:

        - `false` → **uma** proposta, com `has_guarantees: false`.
        - `true` → **duas** propostas no mesmo request, uma com `has_guarantees: false`
          e outra com `has_guarantees: true`, cada uma com seu `proposal_number`
          (precisam ser distintos) e suas próprias taxas.

        Enviar apenas a proposta sem garantias para um lead com `requires_guarantees: true`
        resulta em `422`.
      required:
        - proposals
      properties:
        proposals:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/EConsignadoCltLeadProposalItem"
    EConsignadoCltLeadProposalItem:
      type: object
      description: |
        Uma proposta do envio. Os campos de garantia só são aceitos quando
        `has_guarantees` é `true`, e devem espelhar exatamente os campos não nulos
        de `requested_guarantee` no lead.
      required:
        - proposal_number
        - proposal_valid_until
        - installments_count
        - installment_amount
        - released_amount
        - loan_amount
        - iof_amount
        - annual_rate
        - annual_cet
        - monthly_rate
        - monthly_cet
        - contacts
        - has_guarantees
      properties:
        proposal_number:
          type: string
          maxLength: 20
        proposal_valid_until:
          type: string
          pattern: ^[0-9]{14}$
          example: "23072026235959"
        installments_count:
          type: integer
          minimum: 1
          maximum: 999
        installment_amount:
          type: number
          minimum: 0
        released_amount:
          type: number
          minimum: 0
        loan_amount:
          type: number
          minimum: 0
        iof_amount:
          type: number
          minimum: 0
        annual_rate:
          type: number
          minimum: 0
        annual_cet:
          type: number
          minimum: 0
        monthly_rate:
          type: number
          minimum: 0
        monthly_cet:
          type: number
          minimum: 0
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EConsignadoProposalContact"
        has_guarantees:
          type: boolean
          description: |
            Indica se esta é a proposta com garantias. Exatamente uma proposta do
            envio precisa ter `false`; no máximo uma pode ter `true`.
        fgts_guarantee_balance:
          type: number
          minimum: 0
          description: |
            Saldo do FGTS em garantia. Só na proposta com garantias, e apenas se
            `requested_guarantee.fgts_guarantee_balance` do lead não for nulo.
        severance_penalty_guarantee_amount:
          type: number
          minimum: 0
          description: |
            Multa rescisória em garantia. Só na proposta com garantias, e apenas se
            `requested_guarantee.severance_penalty_guarantee_amount` do lead não for nulo.
        severance_guarantee_percentage:
          type: number
          minimum: 0
          description: |
            Percentual da verba rescisória em garantia. Só na proposta com garantias, e
            apenas se `requested_guarantee.severance_guarantee_percentage` do lead não for nulo.
    EConsignadoCltLeadProposalResponse:
      type: object
      required:
        - lead
        - dataprev_response
      properties:
        lead:
          $ref: "#/components/schemas/EConsignadoCltLead"
        dataprev_response:
          type: array
          items:
            type: object
            additionalProperties: true
    EConsignadoCltLeadOutcomeRequest:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean
          description: true se o trabalhador aceitou a proposta na CTPS Digital.
    EConsignadoCltLeadOutcomeResponse:
      type: object
      required:
        - lead
      properties:
        lead:
          $ref: "#/components/schemas/EConsignadoCltLead"
