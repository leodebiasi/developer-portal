openapi: 3.1.0
info:
  title: API de Contas
  version: ""
  description: |
    A API de Contas da ONZ foi criada para integrar sistemas corporativos a serviços financeiros, com foco em gestão de contas, pagamentos, movimentações financeiras e notificações operacionais. Por meio desta API REST, sua aplicação pode consultar saldos e extratos, iniciar pagamentos, acompanhar transações, configurar webhooks e operar fluxos financeiros de forma segura, rastreável e escalável.

    Esta documentação descreve os recursos disponíveis, os parâmetros obrigatórios e opcionais, os cabeçalhos necessários, os formatos esperados e os exemplos de resposta para cenários de sucesso e erro.

    <h3>Objetivo da API</h3>
    O objetivo desta API é oferecer uma interface padronizada para que empresas acessem recursos bancários diretamente, sem depender de processos manuais. Ela permite automatizar operações como Pix, TED, transferências internas, pagamentos de boletos, consulta de saldo, conciliação de extratos e recebimento de notificações por webhook.

    <h3>O que cada grupo de endpoints representa</h3>
    <ul>
      <li><b>Autenticação:</b> emissão de tokens OAuth 2.0 para acesso seguro aos recursos da API.</li>
      <li><b>Contas:</b> consulta de saldo, extrato transacional e extratos consolidados por período.</li>
      <li><b>Contas BaaS:</b> listagem e consulta das contas filhas criadas dentro de um BaaS.</li>
      <li><b>Onboardings BaaS:</b> criação, envio de documentos e acompanhamento dos processos de abertura de conta vinculados ao BaaS.</li>
      <li><b>Credenciais BaaS:</b> geração de credenciais de API (Contas e QR Codes/Pix) para contas filhas do BaaS.</li>
      <li><b>Pix:</b> criação, consulta e devolução de pagamentos Pix por chave, QR Code ou dados bancários.</li>
      <li><b>Chaves Pix:</b> listagem, criação, remoção e consulta DICT de chaves Pix.</li>
      <li><b>Boletos:</b> consulta, pagamento e acompanhamento de pagamentos de boletos.</li>
      <li><b>Cobranças:</b> emissão de invoices Pix, boleto e híbridas (`PIX_BOLETO`), com listagem, detalhe, emissão de rascunho e cancelamento.</li>
      <li><b>Pagadores:</b> cadastro dos customers usados nas cobranças da API de Contas.</li>
      <li><b>TED:</b> criação e consulta de transferências TED para outras instituições.</li>
      <li><b>Transferências internas:</b> criação e consulta de transferências entre contas da mesma instituição.</li>
      <li><b>Infrações:</b> consulta e resposta a contestações relacionadas a operações Pix.</li>
      <li><b>Estatísticas:</b> consulta de dados estatísticos antifraude DICT de pessoas (CPF/CNPJ) e de chaves Pix registradas.</li>
      <li><b>Crédito Trabalhador:</b> propostas eConsignado CLT (leads, envio e desfecho) e operações Dataprev (autorização e saldo FGTS).</li>
      <li><b>Webhooks:</b> cadastro de URLs para receber notificações assíncronas sobre eventos financeiros.</li>
    </ul>

    <h3>Credenciamento para uso da API</h3>
    Antes de iniciar a integração:
    <ol>
    <li>Solicite a habilitação da conta que será usada na integração;</li>
    <li>Crie as credenciais de API no ambiente administrativo pelo menu "Configurações" -> "API Contas" -> "Nova credencial";</li>
    <li>Para operar múltiplas contas de um BaaS, crie credenciais pelo menu "Configurações" -> "API BaaS" -> "Nova credencial BaaS";</li>
    <li>Solicite o certificado digital de integração.</li>
    </ol>

    <h3>Credenciais BaaS e seleção da conta alvo</h3>
    Credenciais BaaS possuem `clientId` com prefixo `baas_` e são emitidas pela conta dona do BaaS. Elas permitem consultar recursos do BaaS e operar contas filhas vinculadas a esse BaaS.

    Para endpoints operacionais de conta, como saldos, transações, Pix, chaves Pix, estatísticas, TED, boletos, cobranças, pagadores, transferências internas, infrações e webhooks, envie o cabeçalho `x-account-id` com o identificador interno da conta filha que será operada. O cabeçalho é obrigatório apenas para tokens emitidos por credenciais BaaS. Tokens de credenciais de conta continuam operando a própria conta da credencial.

    Endpoints de escopo BaaS, como `GET /accounts`, `GET /accounts/{id}`, `POST /onboarding`, `POST /onboarding/{id}/images`, `GET /onboardings` e `GET /onboardings/{id}`, não exigem `x-account-id`. O vínculo ao BaaS nesses endpoints vem da credencial BaaS autenticada, não de variações de `x-account-id`.

    Observação operacional: a conta dona da credencial BaaS pode ter `accounts.baas_id = null`. Nesse caso, o backend resolve o BaaS pela relação `baas.account_number = account.number`.
servers:
  - url: https://api.example.com/api/v2
tags:
  - name: Autenticação
    description: |
      Esta seção descreve como obter tokens de acesso OAuth 2.0 para autenticar chamadas corporativas. Cada requisição aos recursos protegidos deve enviar um token válido no cabeçalho `Authorization`.
  - name: Contas
    description: |
      Os endpoints de contas permitem consultar saldo, listar transações, obter detalhes de movimentações e gerar extratos consolidados para apoiar conciliação, auditoria e acompanhamento financeiro.
  - name: Onboardings
    description: |
      Os endpoints de onboardings permitem criar processos de abertura de conta, enviar documentos de identificação e acompanhar o status no contexto de uma credencial BaaS.
  - name: Credenciais
    description: |
      Os endpoints de credenciais permitem que a conta dona do BaaS gere credenciais de API (API de Contas e API de QR Codes/Pix) para suas contas filhas. São exclusivos para credenciais BaaS e não exigem o cabeçalho `x-account-id`.
  - name: Pix
    description: |
      Os endpoints Pix permitem iniciar pagamentos instantâneos, consultar transações, validar QR Codes e solicitar devoluções. As operações podem ser feitas por chave Pix, QR Code copia e cola ou dados bancários do favorecido.

      <h4>QR Code Pix (copia e cola)</h4>
      Também é possível pagar usando o código conhecido como "copia e cola", padronizado pelo Banco Central do Brasil e representável por QR Code.
      <h4>Dados bancários do favorecido</h4>
      Como terceira opção, o pagamento pode ser iniciado informando diretamente os dados bancários do recebedor.

      Para gerenciar ou consultar chaves Pix, use a categoria <b>Chaves Pix</b>.
  - name: Chaves Pix
    description: |
      Os endpoints de chaves Pix permitem listar, criar e remover as chaves da conta autenticada, além de consultar dados DICT de qualquer chave informada.

      <h4>Sobre chaves Pix</h4>
      A chave Pix é uma forma simples de identificar o recebedor de uma transferência. Com ela, não é necessário informar agência, conta e demais dados bancários do destinatário. Uma mesma pessoa ou empresa pode possuir mais de uma chave.

      <h4>Gerenciar chaves da conta</h4>
      Use `/accounts/keys` para listar, criar e remover as chaves Pix da conta autenticada.

      <b>Fluxo OTP (EMAIL e PHONE)</b>
      <ol>
        <li><code>POST /accounts/keys/challenge</code> — envia o OTP ao contato e retorna <code>validationHash</code> (auth hash).</li>
        <li>O usuário informa o código recebido por e-mail/SMS (<code>validationCode</code>).</li>
        <li><code>POST /accounts/keys</code> — cria a chave enviando <code>keyType</code>, <code>key</code>, <code>validationHash</code> e <code>validationCode</code>.</li>
      </ol>
      EVP, CPF e CNPJ não precisam de challenge. CPF/CNPJ devem ser o documento da conta.

      Guia completo: documentação <i>Gerenciando chaves Pix</i> (seção Pagamentos).
      O endpoint <code>GET /pix/keys/{key}</code> apenas consulta o DICT de uma chave informada; não gerencia as chaves da conta.
      <table>
        <tr>
          <th>Tipo de chave Pix</th>
          <th>Descrição</th>
          <th>Validação de formato</th>
        </tr>
        <tr>
          <td>CPF</td>
          <td>Documento de pessoa física</td>
          <td>^[0-9]{11}$</td>
        </tr>
        <tr>
          <td>CNPJ</td>
          <td>Documento de pessoa jurídica</td>
          <td>^[0-9]{14}$</td>
        </tr>
        <tr>
          <td>Telefone</td>
          <td>Número de telefone</td>
          <td>^+[1-9][0-9]\d{1,14}$</td>
        </tr>
        <tr>
          <td>E-mail</td>
          <td>Endereço de e-mail</td>
          <td>^[a-z0-9.!#$&'*+\\\\/=?^_`{|}~-]+@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$</td>
        </tr>
        <tr>
          <td>EVP (chave aleatória)</td>
          <td>Chave aleatória gerada pelo Banco Central do Brasil</td>
          <td>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$</td>
        </tr>
      </table>
  - name: Boletos
    description: |
      Os endpoints de boletos permitem consultar informações do título, iniciar o pagamento, listar pagamentos realizados e acompanhar o detalhe de cada operação.
  - name: Infrações
    description: |
      Infrações são mecanismos de contestação de operações Pix, geralmente relacionadas a suspeita de fraude. Estes endpoints permitem consultar casos e enviar defesas quando aplicável.
  - name: Estatísticas
    description: |
      Os endpoints de estatísticas permitem consultar dados antifraude agregados do DICT para usuários finais (CPF/CNPJ) e chaves Pix registradas.

      Paths do módulo:
      <ul>
        <li><code>GET /statistics/person/{taxIdNumber}</code></li>
        <li><code>GET /statistics/key/{key}</code></li>
      </ul>

      Os contadores agregados consideram três janelas:
      <ul>
        <li><b>d90</b>: últimos 89 dias, incluindo o dia corrente</li>
        <li><b>m12</b>: últimos 12 meses, sem incluir o mês corrente</li>
        <li><b>m60</b>: últimos 60 meses, sem incluir o mês corrente</li>
      </ul>

      Guia completo: documentação <i>Estatísticas DICT</i> (seção Pagamentos).
  - name: Crédito Trabalhador
    description: |
      Fluxo de Crédito do Trabalhador / CTPS Digital: listagem de leads,
      envio de propostas, registro do desfecho, autorização e consulta FGTS.

      Guias: *Propostas eConsignado CLT* e *Dataprev*, dentro de
      *Crédito Trabalhador* (seção Pagamentos).
  - name: Webhooks
    description: |
      Utilize webhooks para receber notificações sobre eventos da API assim que eles ocorrerem, como liquidação de Pix, recebimentos, devoluções, falhas em operações de saída e abertura de infrações.
      Quando um evento assinado acontece, a ONZ envia uma notificação HTTP para a URL configurada no seu ambiente.<br><br><br>
      <img src='/img/web-hooks-flow.png'>

      <h3>Comportamento em caso de falhas recorrentes</h3>
      <table>
        <tr>
          <th>Quantidade de falhas</th>
          <th>Ação</th>
        </tr>
        <tr>
          <td>1 a 5 falhas</td>
          <td>As mensagens enfileiradas serão reenviadas após 2 minutos</td>
        </tr>
        <tr>
          <td>6 a 10 falhas</td>
          <td>As mensagens enfileiradas serão reenviadas em intervalos de 15 minutos</td>
        </tr>
        <tr>
          <td>11 a 15 falhas</td>
          <td>As mensagens enfileiradas serão reenviadas em intervalos de 60 minutos</td>
        </tr>
        <tr>
          <td>Mais de 15 falhas</td>
          <td>O processamento do webhook será desativado</td>
        </tr>
      </table>
  - name: Transferências Internas
    description: |
      Os endpoints de transferências internas permitem criar e consultar transferências entre contas da mesma instituição.
  - name: TED
    description: |
      Os endpoints de TED permitem criar e consultar transferências para contas de outras instituições financeiras.
  - name: Cobranças
    description: |
      Os endpoints de cobranças (invoices) permitem criar, listar, consultar, emitir e cancelar títulos Pix, boleto registrado ou híbridos (`PIX_BOLETO`) no host da API de Contas.

      Escopos: `invoices.read` e `invoices.write`. Criação exige `x-idempotency-key` (máximo 50 caracteres).
      `pixKey` é obrigatória quando o método inclui Pix. Credencial BaaS envia `x-account-id`.

      Guia: documentação <i>Cobranças Pix e boleto</i> (seção Pagamentos).
  - name: Pagadores
    description: |
      Cadastro de pagadores (`customers`) usados nas cobranças da API de Contas. O `customerId` da invoice aponta para este recurso, isolado por conta.

      Escopos: `invoices.read` e `invoices.write`.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            pix.read: Permite consultar operações Pix, listar chaves Pix da conta e consultar estatísticas DICT
            pix.write: Permite criar pagamentos, devoluções e gerenciar chaves Pix da conta
            billets.read: Permite consultar boletos
            billets.write: Permite criar pagamentos de boletos
            webhook.read: Permite consultar webhooks
            webhook.write: Permite criar e remover webhooks
            transactions.read: Permite consultar transações
            account.read: Permite consultar informações da conta
            baas.accounts.read: Permite listar e consultar contas filhas do BaaS
            baas.onboarding.read: Permite listar e consultar onboardings do BaaS
            baas.onboarding.write: Permite criar onboardings no BaaS
            baas.credentials.write: Permite gerar credenciais de API para contas filhas do BaaS
            internal-transfer.read: Permite consultar transferências internas
            internal-transfer.write: Permite criar transferências internas
            ted.read: Permite consultar transferências TED
            ted.write: Permite criar transferências TED
            econsignado.read: Permite listar leads CLT e consultar autorização/saldo FGTS
            econsignado.write: Permite enviar proposta/desfecho de leads CLT e solicitar autorização FGTS
            invoices.read: Permite consultar cobranças e pagadores
            invoices.write: Permite criar, emitir, cancelar cobranças e gerenciar pagadores
  requestBodies:
    AuthData:
      required: true
      content:
        application/json:
          schema:
            required:
              - clientId
              - clientSecret
              - grantType
            properties:
              clientId:
                type: string
                description: Identificador da credencial. Credenciais BaaS usam prefixo `baas_`.
              clientSecret:
                type: string
              grantType:
                type: string
                default: client_credentials
              scope:
                type: string
        application/x-www-form-urlencoded:
          schema:
            properties:
              client_id:
                type: string
                description: Identificador da credencial. Credenciais BaaS usam prefixo `baas_`.
              client_secret:
                type: string
              grant_type:
                type: string
                default: client_credentials
              scope:
                type: string
    WebhookData:
      required: true
      content:
        application/json:
          schema:
            properties:
              uri:
                type: string
                format: uri
              email:
                type: string
                description: E-mail utilizado para realizar as notificações de erros de envio de webhooks
              method:
                type: string
                enum:
                  - POST
                  - GET
                  - PUT
                default: POST
              enabled:
                type: boolean
                default: true
              pauseOnFail:
                type: boolean
                default: true
              headers:
                type: object
                properties:
                  headerName:
                    type: string
            required:
              - uri
              - enabled
    WebhookPayload:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                $ref: "#/components/schemas/PixDataProperties"
              type:
                type: string
                enum:
                  - TRANSFER
                  - RECEIVE
                  - REFUND
                  - CASHOUT
    CashOutWebhookPayload:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                $ref: "#/components/schemas/CashoutWebhookProperties"
    InfractionWebhookPayload:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                $ref: "#/components/schemas/InfractionData"
              type:
                type: string
                const: INFRACTION
    InvoiceWebhookPayload:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvoiceWebhookNotification"
    PixQrcData:
      required: true
      content:
        application/json:
          schema:
            required:
              - qrCode
              - payment
            properties:
              qrCode:
                type: string
              creditorDocument:
                type: string
              priority:
                description: Quando definido como `HIGH`, o pagamento é processado imediatamente, sem passar pela fila. O valor `HIGH` só é permitido quando `creditorDocument` for informado.
                type: string
                enum:
                  - HIGH
                  - NORM
              description:
                type: string
              paymentFlow:
                $ref: "#/components/schemas/PaymentFlowType"
              expiration:
                $ref: "#/components/schemas/PixCashOutExpiration"
              payment:
                type: object
                properties:
                  currency:
                    type: string
                    enum:
                      - BRL
                  amount:
                    type: number
                    format: double
              ispbDeny:
                $ref: "#/components/schemas/IspbDenyList"
    PixManuData:
      required: true
      content:
        application/json:
          schema:
            required:
              - creditorAccount
              - payment
            properties:
              priority:
                description: Quando definido como `HIGH`, o pagamento é processado imediatamente, sem passar pela fila. O valor `HIGH` só é permitido quando `creditorDocument` for informado.
                type: string
                enum:
                  - HIGH
                  - NORM
              description:
                type: string
              paymentFlow:
                $ref: "#/components/schemas/PaymentFlowType"
              expiration:
                $ref: "#/components/schemas/PixCashOutExpiration"
              creditorAccount:
                $ref: "#/components/schemas/CreditorData"
              payment:
                type: object
                properties:
                  currency:
                    type: string
                    enum:
                      - BRL
                  amount:
                    type: number
                    format: double
              ispbDeny:
                $ref: "#/components/schemas/IspbDenyList"
    PixDictData:
      required: true
      content:
        application/json:
          schema:
            required:
              - pixKey
              - payment
            properties:
              pixKey:
                type: string
                description: "Chave Pix aceita: CPF, CNPJ, e-mail, telefone ou EVP (chave aleatória)."
              creditorDocument:
                type: string
              endToEndId:
                type: string
                description: |
                  Identificador único obtido através da consulta de chave PIX.
                  Este parâmetro é opcional e deve ser utilizado para garantir a baixa correta do saldo da ficha de consultas de chave PIX.
              priority:
                description: Quando definido como `HIGH`, o pagamento é processado imediatamente, sem passar pela fila. O valor `HIGH` só é permitido quando `creditorDocument` for informado.
                type: string
                enum:
                  - HIGH
                  - NORM
              description:
                type: string
              paymentFlow:
                $ref: "#/components/schemas/PaymentFlowType"
              expiration:
                $ref: "#/components/schemas/PixCashOutExpiration"
              payment:
                type: object
                properties:
                  currency:
                    type: string
                    enum:
                      - BRL
                  amount:
                    type: number
                    format: double
              ispbDeny:
                $ref: "#/components/schemas/IspbDenyList"
    BilletPaymentRegisterRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - digitableCode
              - description
            properties:
              digitableCode:
                type: string
                description: Representação numérica do código de barras do boleto (linha digitável). Informe apenas números.
              description:
                type: string
              paymentFlow:
                $ref: "#/components/schemas/PaymentFlowType"
              payment:
                type: object
                properties:
                  currency:
                    type: string
                    enum:
                      - BRL
                  amount:
                    type: number
                    format: double
    BilletPaymentRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - billetCode
              - description
            properties:
              billetCode:
                type: string
                maxLength: 50
                description: Representação numérica da linha digitável ou do código de barras do boleto. Informe apenas números.
              description:
                type: string
              paymentFlow:
                $ref: "#/components/schemas/PaymentFlowType"
              payment:
                type: object
                properties:
                  currency:
                    type: string
                    enum:
                      - BRL
                  amount:
                    type: number
                    format: double
    BilletData:
      required: true
      content:
        application/json:
          schema:
            properties:
              customerTitleNumber:
                type: string
              customerInternalCtrlTitleNumber:
                type: string
              titleIssuanceDate:
                type: string
                format: date-time
              titleDueDate:
                type: string
                format: date-time
              faceTitleAmount:
                type: number
                format: double
              iofAmount:
                type: number
                format: double
              protest:
                $ref: "#/components/schemas/BilletProtestData"
              issuer:
                $ref: "#/components/schemas/BilletPersonData"
              assignor:
                $ref: "#/components/schemas/BilletPersonData"
              debtor:
                $ref: "#/components/schemas/BilletPersonData"
              interest:
                $ref: "#/components/schemas/BilletAddicionalValueData"
              penalty:
                $ref: "#/components/schemas/BilletAddicionalValueData"
              bonus:
                $ref: "#/components/schemas/BilletReductionValueData"
              discounts:
                type: array
                items:
                  $ref: "#/components/schemas/BilletReductionValueData"
    InternalTransferData:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalTransferRequest"
  schemas:
    Token:
      type: object
      properties:
        tokenType:
          type: string
        expiresAt:
          type: integer
          format: int32
        refreshExpiresIn:
          type: integer
          format: int32
        notBeforePolicy:
          type: integer
          format: int32
        accessToken:
          type: string
        scope:
          type: string
    creditDebitType:
      type: string
      enum:
        - CREDIT
        - DEBIT
    AccountType:
      type: string
      description: Tipos de conta utilizados para pagamento, conforme modalidades tradicionais definidas pela Resolução BCB 4.753. Não inclui contas vinculadas, contas de residentes no exterior, contas em moeda estrangeira ou contas de correspondentes de moeda eletrônica.
      oneOf:
        - title: SLRY
          const: SLRY
          description: Conta salário
        - title: SVGS
          const: SVGS
          description: Conta poupança.
        - title: CACC
          const: CACC
          description: Conta corrente.
        - title: TRAN
          const: TRAN
          description: Conta de pagamento pré-paga.
    IspbDenyList:
      description: Lista de códigos ISPB (Identificador de Sistema de Pagamentos Brasileiro) para os quais o pagamento não será permitido.
      type: array
      items:
        type: string
    Ispb:
      type: string
      description: O ISPB é um código numérico único e padronizado que identifica cada instituição financeira no Sistema de Pagamentos Brasileiro.
    Issuer:
      type: string
      description: Código da agência da conta, sem dígito.
    AccountNumber:
      type: string
      description: Número da conta do recebedor, incluindo dígito verificador quando aplicável. Valores alfanuméricos devem ser convertidos para 0.
    PixCashOutExpiration:
      type: integer
      format: int64
      default: 600
      minimum: 1
      maximum: 10800
      description: Tempo máximo, em segundos, que a operação pode permanecer na fila aguardando processamento antes de ser cancelada.
    RemittanceInformation:
      type: string
