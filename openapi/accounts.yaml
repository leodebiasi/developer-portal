          type: string
          description: Nome do titular da chave.
        tradeName:
          type: string
          description: Nome fantasia do titular, quando aplicável.
        taxIdNumber:
          type: string
          description: CPF ou CNPJ do titular.
        creationDate:
          type: string
          format: date-time
          description: Data de criação da chave no DICT.
        keyOwnershipDate:
          type: string
          format: date-time
          description: Data de posse da chave no DICT.
    AccountPixKeyCreateRequest:
      type: object
      required:
        - keyType
      properties:
        keyType:
          type: string
          enum:
            - EVP
            - CPF
            - CNPJ
            - EMAIL
            - PHONE
          description: |
            Tipo da chave a criar.
            Para CPF/CNPJ, o tipo deve corresponder ao tipo de pessoa da conta.
            Para EMAIL/PHONE, `validationHash` e `validationCode` são obrigatórios
            (obtidos via `POST /accounts/keys/challenge`).
        key:
          type: string
          description: |
            Valor da chave. Obrigatório para CPF, CNPJ, EMAIL e PHONE.
            Para CPF/CNPJ deve ser igual ao documento da conta.
            Omitido para EVP (a chave aleatória é gerada pelo DICT).
        validationHash:
          type: string
          format: uuid
          description: |
            Auth hash retornado por `POST /accounts/keys/challenge`.
            Obrigatório para EMAIL e PHONE.
        validationCode:
          type: string
          description: |
            Código OTP recebido por e-mail ou SMS.
            Obrigatório para EMAIL e PHONE.
      additionalProperties: false
      example:
        keyType: EVP
    AccountPixKeyChallengeRequest:
      type: object
      required:
        - keyType
        - key
      properties:
        keyType:
          type: string
          enum:
            - EMAIL
            - PHONE
          description: Tipo da chave que será validada por OTP.
        key:
          type: string
          description: E-mail ou telefone (E.164, ex. +5511999999999) a validar.
      additionalProperties: false
      example:
        keyType: EMAIL
        key: usuario@exemplo.com
    AccountPixKeyChallengeResponse:
      type: object
