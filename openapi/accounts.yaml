          type: object
          properties:
            status:
              type: string
              enum:
                - PENDING
                - ACCEPTED
                - REJECTED
                - EXPIRED
            sent_at:
              type: string
              format: date-time
              nullable: true
            accepted_at:
              type: string
              format: date-time
              nullable: true
            rejected_at:
              type: string
              format: date-time
              nullable: true
            expires_at:
              type: string
              format: date-time
              nullable: true
    EConsignadoFgtsBalanceRequest:
      type: object
      required:
        - employer_registration_type
        - employer_registration_number
        - employee_id
        - cpf
      properties:
        employer_registration_type:
          type: integer
          description: Código eSocial/Dataprev do empregador (1=CNPJ, 2=CPF, 3=CAEPF, 4=CNO).
        employer_registration_number:
          type: string
          pattern: ^([0-9]{8}|[0-9]{11}|[0-9]{14})$
        employee_id:
          type: string
          minLength: 1
          maxLength: 30
          description: Matrícula do trabalhador.
        cpf:
          type: string
          pattern: ^[0-9]{11}$
    EConsignadoFgtsBalanceResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: Payload Dataprev (ex. valor_saldo_disponivel_consignado).
  parameters:
    XAccountId:
      name: x-account-id
      in: header
      description: |
        Identificador interno da conta filha que será operada. Obrigatório quando o token foi emitido por uma credencial BaaS (`clientId` com prefixo `baas_`) em endpoints operacionais de conta.
      required: false
      schema:
        type: integer
        format: int64
    AccountId:
      name: resourceId
      in: path
      description: ID da conta.
      required: true
      schema:
        type: string
        format: uuid
    Offset:
      name: page
      in: query
      description: Número da página para paginação.
      required: true
      schema:
        type: integer
        minimum: 1
    RelatedResourceId:
      name: relatedResourceId
      in: path
      description: ID do recurso relacionado.
      required: true
      schema:
        type: string
paths:
  /oauth/token:
    post:
      tags:
        - Autenticação
      summary: Obter token de acesso.
      description: |
        O primeiro passo para utilizar a API corporativa é a autenticação. Nesta etapa, o servidor de autorização valida as credenciais do cliente e emite um token de acesso.

        A API utiliza tokens Bearer do OAuth 2.0. Toda requisição a recursos protegidos deve incluir o token no cabeçalho HTTP `Authorization`. Após obter o token, sua aplicação pode acessar os endpoints compatíveis com os escopos concedidos.

        <b>Escopos</b>
        <br />
        Os escopos definem quais recursos bancários poderão ser acessados pelo token.
        <table border>
          <tr>
            <th>Recurso</th>
            <th>Escopo de leitura</th>
            <th>Escopo de escrita</th>
            <th>Acessível via</th>
          </tr>
          <tr>
            <td>Pix</td>
            <td>pix.read</td>
            <td>pix.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Boletos</td>
            <td>billets.read</td>
            <td>billets.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Webhook</td>
            <td>webhook.read</td>
            <td>webhook.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Transações</td>
            <td>transactions.read</td>
            <td></td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Conta</td>
            <td>account.read</td>
            <td></td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Infrações</td>
            <td>infractions.read</td>
            <td>infractions.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Transferências internas</td>
            <td>internal-transfer.read</td>
            <td>internal-transfer.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>TED</td>
            <td>ted.read</td>
            <td>ted.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Crédito Trabalhador</td>
            <td>econsignado.read</td>
            <td>econsignado.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Cobranças</td>
            <td>invoices.read</td>
            <td>invoices.write</td>
            <td>Token corporativo</td>
          </tr>
          <tr>
            <td>Contas BaaS</td>
            <td>baas.accounts.read</td>
            <td></td>
            <td>Credencial BaaS</td>
          </tr>
          <tr>
            <td>Onboardings BaaS</td>
            <td>baas.onboarding.read</td>
            <td>baas.onboarding.write</td>
            <td>Credencial BaaS</td>
          </tr>
          <tr>
            <td>Credenciais BaaS</td>
            <td></td>
            <td>baas.credentials.write</td>
            <td>Credencial BaaS</td>
          </tr>
        </table>
      operationId: postToken
      requestBody:
        $ref: "#/components/requestBodies/AuthData"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
  /accounts:
    get:
      tags:
        - Contas
      summary: Listar contas do BaaS.
      description: |
        Lista as contas filhas pertencentes ao BaaS da credencial autenticada. Este endpoint é exclusivo para credenciais BaaS e não exige o cabeçalho `x-account-id`.

        A conta dona do BaaS não é retornada nesta listagem.
      operationId: listBaasAccounts
      parameters:
        - name: page
          in: query
          description: Número da página para paginação.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Quantidade máxima de itens por página.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Status interno da conta.
          required: false
          schema:
            type: integer
        - name: type
          in: query
          description: Tipo da conta.
          required: false
          schema:
            type: string
        - name: document
          in: query
          description: Documento do titular da conta.
          required: false
          schema:
            type: string
        - name: accountNumber
          in: query
          description: Número da conta.
          required: false
          schema:
            type: integer
        - name: createdAtStart
          in: query
          description: Data inicial de criação da conta (ISO 8601).
          required: false
          schema:
            type: string
            format: date-time
        - name: createdAtEnd
          in: query
          description: Data final de criação da conta (ISO 8601).
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaasAccountList"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - baas.accounts.read
  /accounts/{id}:
    get:
      tags:
        - Contas
      summary: Consultar conta do BaaS.
      description: |
        Retorna os dados públicos de uma conta filha do BaaS da credencial autenticada. Este endpoint é exclusivo para credenciais BaaS e não exige o cabeçalho `x-account-id`.
      operationId: getBaasAccount
      parameters:
        - name: id
          in: path
          description: Identificador interno da conta filha.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaasAccountResponse"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - baas.accounts.read
  /accounts/{accountId}/credentials:
    post:
      tags:
        - Credenciais
      summary: Gerar credencial da API de Contas para conta filha.
      description: |
        Gera uma nova credencial da API de Contas (`clientId` e `clientSecret`) para uma conta filha do BaaS da credencial autenticada.

        Este endpoint é exclusivo para credenciais BaaS, não exige o cabeçalho `x-account-id` e não pode ser utilizado para a própria conta dona do BaaS. A conta filha precisa estar ativa e habilitada para a API de Contas.

        O `clientSecret` é retornado apenas no momento da criação e não pode ser recuperado posteriormente. Cada conta filha pode ter no máximo 10 credenciais ativas da API de Contas.
      operationId: createBaasAccountCredential
      parameters:
        - name: accountId
          in: path
          description: Identificador interno da conta filha.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - allowedIps
                - scopes
              properties:
                description:
                  type: string
                  description: Descrição da credencial, para identificação.
                allowedIps:
                  type: array
                  description: |
                    Lista de IPs autorizados a utilizar a credencial. Aceita endereços IPv4 (ex.: `200.150.100.50`) ou faixas em notação CIDR (ex.: `200.150.100.0/24`). Pode ser enviada vazia, mas recomenda-se restringir os IPs de origem.
                  items:
                    type: string
                scopes:
                  type: array
                  description: Escopos concedidos à credencial. Definem quais recursos a credencial poderá acessar.
                  items:
                    type: string
                    enum:
                      - pix.read
                      - pix.write
                      - pix.create
                      - account.read
                      - transactions.read
                      - webhook.read
                      - webhook.write
                      - billets.read
                      - billets.write
                      - billets.create
                      - internal-transfer.read
                      - internal-transfer.write
                      - internal-transfer.create
                      - ted.read
                      - ted.write
                      - ted.create
                      - infractions.read
                      - infractions.write
            examples:
              default:
                summary: Exemplo de criação de credencial
                value:
                  description: Integração ERP
                  allowedIps:
                    - 200.150.100.50
                    - 200.150.100.0/24
                  scopes:
                    - pix.read
                    - pix.write
                    - account.read
      responses:
        "200":
          description: Credencial criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                    format: uuid
                    description: Identificador da credencial.
                  clientSecret:
                    type: string
                    format: uuid
                    description: Segredo da credencial. Retornado apenas na criação.
                  id:
                    type: integer
                    format: int64
                    description: Identificador interno da credencial.
                  description:
                    type: string
                  allowedIps:
                    type: array
                    items:
                      type: string
              examples:
                default:
                  summary: Exemplo de resposta
                  value:
                    clientId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    clientSecret: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
                    id: 1234
                    description: Integração ERP
                    allowedIps:
                      - 200.150.100.50
                      - 200.150.100.0/24
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "422":
          description: Não processável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - baas.credentials.write
  /accounts/{accountId}/pix-credentials:
    post:
      tags:
        - Credenciais
      summary: Gerar credencial da API de QR Codes (Pix) para conta filha.
      description: |
        Gera uma nova credencial da API de QR Codes/Pix (`clientId` e `clientSecret`) para uma conta filha do BaaS da credencial autenticada e garante que a conta possua uma chave Pix aleatória (EVP) para recebimentos.

        Este endpoint é exclusivo para credenciais BaaS, não exige o cabeçalho `x-account-id` e não pode ser utilizado para a própria conta dona do BaaS. A conta filha precisa estar ativa e habilitada para a API de QR Codes.

        O `clientSecret` é retornado apenas no momento da criação e não pode ser recuperado posteriormente.
      operationId: createBaasPixCredential
      parameters:
        - name: accountId
          in: path
          description: Identificador interno da conta filha.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credencial criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                    description: Identificador da credencial Pix.
                  clientSecret:
                    type: string
                    description: Segredo da credencial. Retornado apenas na criação.
                  pixKey:
                    type: string
                    description: Chave Pix aleatória (EVP) associada à conta para recebimentos.
                  pixKeyCreated:
                    type: boolean
                    description: Indica se a chave Pix foi criada nesta requisição (`true`) ou se já existia (`false`).
              examples:
                default:
                  summary: Exemplo de resposta
                  value:
                    clientId: "000100012345678901234567890"
                    clientSecret: Yjg2N2I5ZjNjMDhmNGZhOWE2ZGM0
                    pixKey: e1f2a3b4-c5d6-7890-abcd-ef1234567890
                    pixKeyCreated: true
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "422":
          description: Não processável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - baas.credentials.write
  /onboarding:
    post:
      tags:
        - Onboardings
      summary: Criar onboarding no BaaS.
      description: |
        Cria um novo processo de abertura de conta vinculado ao BaaS da credencial autenticada. Este endpoint é exclusivo para credenciais BaaS e não exige o cabeçalho `x-account-id`.

        O vínculo do onboarding ao BaaS deve vir da credencial BaaS autenticada, não de variações de `x-account-id`. A conta dona da credencial pode ter `accounts.baas_id = null`; nesse caso o backend resolve o BaaS pela relação `baas.account_number = account.number`.

        O onboarding é criado com status `Aguardando aprovação` (1). A análise e aprovação são realizadas pelo time operacional da instituição.

        A funcionalidade depende da preferência `ENABLE_ONBOARDING_API_ENDPOINT` estar habilitada no ambiente.
      operationId: createBaasOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BaasOnboardingCreateNaturalPerson"
                - $ref: "#/components/schemas/BaasOnboardingCreateLegalPerson"
            examples:
              pessoaFisica:
                summary: Pessoa física
                value:
                  accountType: NATURAL_PERSON
                  person:
                    name: João da Silva Santos
                    document: "12345678901"
                    email: joao.silva@email.com
                    phone: "11987654321"
                    address:
                      zipCode: "01310100"
                      address: Avenida Paulista
                      number: "1578"
                      complement: Apto 101
                      district: Bela Vista
              pessoaJuridica:
                summary: Pessoa jurídica
                value:
                  accountType: LEGAL_PERSON
                  person:
                    name: Maria Oliveira Costa
                    document: "98765432100"
                    email: maria.oliveira@techsol.com.br
                    phone: "11999887766"
                    address:
                      zipCode: "04543011"
                      address: Avenida Brigadeiro Faria Lima
                      number: "3477"
                      district: Itaim Bibi
                  company:
                    name: Tech Solutions LTDA
                    tradeName: TechSol
                    document: "12345678000190"
                    email: contato@techsol.com.br
                    phone: "1133334444"
      responses:
        "201":
          description: Onboarding criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaasOnboardingCreateResponse"
              examples:
                default:
                  summary: Exemplo de resposta
                  value:
                    message: Onboarding created successfully
                    id: 4fdd34d2-e9fa-4bb5-bfeb-84281f77f19a
                    status: 1
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "422":
          description: Não processável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
              examples:
                apiDisabled:
                  summary: API de onboarding desabilitada
                  value:
                    type: onz-0001
                    title: Onboarding API is disabled
                    status: 422
                    detail: Onboarding API is disabled
                    instance: /api/v2/onboarding
                personExists:
                  summary: Pessoa já cadastrada
                  value:
                    type: onz-0001
                    title: Person already exists
                    status: 422
                    detail: Person already exists
                    instance: /api/v2/onboarding
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
      security:
        - OAuth2:
            - baas.onboarding.write
  /onboarding/{id}/images:
    post:
      tags:
        - Onboardings
      summary: Enviar imagem do onboarding.
      description: |
        Envia documentos de identificação e selfie para um onboarding previamente criado. Este endpoint é exclusivo para credenciais BaaS e não exige o cabeçalho `x-account-id`.

        Tipos aceitos:
        - `FRONT`: frente do documento
        - `BACK`: verso do documento
        - `SELFIE`: selfie do titular

        O upload só é permitido enquanto o onboarding estiver com status `Pendente` (0) ou `Aguardando aprovação` (1). Arquivos devem estar em JPG ou PNG, com tamanho máximo de 10 MB.

        A funcionalidade depende da preferência `ENABLE_ONBOARDING_API_ENDPOINT` estar habilitada no ambiente.
      operationId: uploadBaasOnboardingImage
      parameters:
        - name: id
          in: path
          description: Identificador do onboarding.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - type
                - file
              properties:
                type:
                  type: string
                  enum:
                    - FRONT
                    - BACK
                    - SELFIE
                  description: Tipo da imagem enviada.
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem (JPG ou PNG, máximo 10 MB).
            examples:
              frente:
                summary: Frente do documento
                value:
                  type: FRONT
                  file: (binary)
              verso:
                summary: Verso do documento
                value:
                  type: BACK
                  file: (binary)
              selfie:
                summary: Selfie
                value:
                  type: SELFIE
                  file: (binary)
      responses:
        "200":
          description: Imagem enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaasOnboardingImageUploadResponse"
              examples:
                frente:
                  summary: Frente do documento
                  value:
                    image:
                      type: FRONT
                      url: https://example.com/onboarding/38005732-ab00-4e7d-87c0-5835edc1ed65/front.png?{signedUrl}
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
              examples:
                invalidFileType:
                  summary: Tipo de arquivo inválido
                  value:
                    type: onz-0002
                    title: Invalid file type
                    status: 400
                    detail: The uploaded file must be an image in JPG or PNG format
                    instance: /api/v2/onboarding/{id}/images
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
              example:
                type: onz-0025
                title: Onboarding not found
                status: 404
                detail: Onboarding not found
                instance: /api/v2/onboarding/{id}/images
        "422":
          description: Não processável
