            example:
              page: 1
              per_page: 25
              status:
                - NEW
                - PROPOSAL_SENT
              filter: Maria
              created_at_from: "2026-08-01T00:00:00.000Z"
              created_at_to: "2026-08-11T23:59:59.999Z"
              sort_by: created_at
              sort_order: desc
      responses:
        "200":
          description: Lista paginada de leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EConsignadoCltLeadListResponse"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRFC7807"
        "401":
