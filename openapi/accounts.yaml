  /invoices:
    post:
      tags:
        - Cobranças
      summary: Criar cobrança Pix, boleto ou híbrida.
      description: |
        Cria uma invoice para um pagador da conta autenticada.
        Header `x-idempotency-key` obrigatório (1–50 caracteres).
        Envie `customerId` ou `payer`, nunca os dois.
        `pixKey` é obrigatória quando `paymentMethod` inclui Pix.
        `IMMEDIATE` registra na criação; `SCHEDULED` cria em `DRAFT`.
        Em cobranças `SCHEDULED` via `BOLETO` ou `PIX_BOLETO`, `emit: true`
        registra a cobrança na mesma chamada.
      operationId: postInvoice
      parameters:
        - $ref: "#/components/parameters/XAccountId"
        - name: x-idempotency-key
          in: header
          required: true
          description: Identificador único da requisição para controle de idempotência.
          schema:
            type: string
            minLength: 1
            maxLength: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreateRequest"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "403":
          description: Módulo de cobranças desligado ou acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "409":
          description: Chave de idempotência reutilizada com outro payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "422":
          description: Entidade não processável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "503":
          description: Autenticação da API de Contas indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"

      security:
        - OAuth2:
            - invoices.write
    get:
      tags:
        - Cobranças
      summary: Listar cobranças.
      operationId: listInvoices
      parameters:
        - $ref: "#/components/parameters/XAccountId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: filter
          in: query
          description: Filtra por descrição ou nome do pagador.
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          description: |
            Filtra pelo status da cobrança. `WRITTEN_OFF` representa cobranças
            pagas por outro canal.
          schema:
            type: string
            enum:
              - DRAFT
              - REGISTERING
              - PENDING
              - OVERDUE
              - COMPLETED
              - CANCELED
              - FAILED
              - WRITTEN_OFF
        - name: dateField
          in: query
          description: Campo usado pelo filtro de período.
          schema:
            type: string
            enum:
              - CREATED_AT
              - DUE_DATE
              - PAID_AT
            default: CREATED_AT
        - name: startDate
          in: query
          description: |
            Início inclusivo do período. Envie junto com `endDate`.
            Aceita `YYYY-MM-DD` ou ISO 8601 com `Z`/offset. Uma data sem
            horário começa à meia-noite em `America/Sao_Paulo`.
          schema:
            type: string
        - name: endDate
          in: query
          description: |
            Fim inclusivo do período, igual ou posterior a `startDate`.
            Envie junto com `startDate`. Aceita `YYYY-MM-DD` ou ISO 8601 com
            `Z`/offset. Uma data sem horário termina no fim do dia em
            `America/Sao_Paulo`.
          schema:
            type: string
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "401":
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "403":
          description: Módulo de cobranças desligado ou acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "409":
          description: Chave de idempotência reutilizada com outro payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "422":
          description: Entidade não processável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"
        "503":
          description: Autenticação da API de Contas indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvoiceApi"

      security:
        - OAuth2:
            - invoices.read
