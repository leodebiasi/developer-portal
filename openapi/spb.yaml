                  type: string
                type: object
        '500':
          description: Failed to export transactions
          content:
            text/csv:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Export transactions (CSV)
      tags:
        - transactions
  /health/live:
    servers:
      - url: /
    get:
      description: Returns 200 when the process is up. Does not check dependencies.
      responses:
        '200':
          description: OK (no content)
      summary: Liveness probe (SPB API)
      tags:
        - health
  /health/ready:
    servers:
      - url: /
    get:
      description: >-
        Probes PostgreSQL, RabbitMQ, and every configured IBM MQ queue manager.
        Returns 200 with per-dependency status when ready, 503 otherwise. Also
        updates DB connection pool gauges.
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health.readyResponse'
        '503':
          description: not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health.readyResponse'
      summary: Readiness probe (SPB API)
      tags:
        - health
  /version:
    servers:
      - url: /
    get:
      description: >-
        Returns the build version tag and commit SHA baked into the binary at
        build time.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/version.VersionResponse'
      summary: Build version
      tags:
        - version
  /longpolling/v1/health/live:
    servers: []
    get:
      summary: Liveness probe (Long Polling)
      tags:
        - health
      description: Returns `OK` when the process is up. No dependencies checked.
      security: []
      responses:
        '200':
          description: Always the literal string `OK`.
          content:
            application/json:
              schema:
                type: string
                enum:
                  - OK
                description: Always the literal string `OK`.
  /longpolling/v1/messages/{pullNext}:
    servers: []
    get:
      summary: Pull the next SPB message
      tags:
        - longpolling
      description: >-
        Long-polling endpoint. The first call MUST use `pullNext=start`;
        subsequent calls reuse the value returned in the `onz-pull-next`
        response header. The connection is held for up to ~5s waiting for a new
        message.


        **200 body** is either the next message envelope (see the `LpMessage`
        schema) or an empty body for bootstrap requests. **204** means the
        polling window expired. The `onz-pull-next` response header always
        carries the cursor for the next call.


        ```json

        {



          "id": 1,
          "operation_id": "op-uuid",
          "event_type": "response",
          "message_type": "PACS008",
          "sender": "12345678",
          "recipient": "08253539",
          "plaintext": "<xml/>",
          "created_at": "2025-01-01T00:00:00Z",
          "updated_at": "2025-01-01T00:00:00Z"
        }

        ```
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: pullNext
          required: true
          description: >-
            `start` to bootstrap a session, otherwise the value of the previous
            `onz-pull-next` header.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >-
            Either the next SPB message envelope or an empty bootstrap
            acknowledgement. Inspect `onz-pull-next` for the next cursor.
          headers:
            onz-pull-next:
              schema:
                type: string
              description: >-
                Opaque cursor to pass as `pullNext` on the next call. Always
                set, even when the response body is empty.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LpMessage'
                  - type: object
                    additionalProperties: false
                    description: >-
                      Empty bootstrap acknowledgement returned for
                      `pullNext=start`. The session is now active; use
                      `onz-pull-next` for the subsequent poll.
        '204':
          description: >-
            Long-polling window expired without a new message. Reissue the
            request with the latest `onz-pull-next`.
          headers:
            onz-pull-next:
              schema:
                type: string
        '401':
          description: >-
            Standard error envelope (matches AppError.toJSON output across
            services).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  statusCode:
                    type: integer
                  message:
                    type: string
                required:
                  - error
                  - statusCode
                  - message
                additionalProperties: true
                description: >-
                  Standard error envelope (matches AppError.toJSON output across
                  services).
        '500':
          description: >-
            Standard error envelope (matches AppError.toJSON output across
            services).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  statusCode:
                    type: integer
                  message:
                    type: string
                required:
                  - error
                  - statusCode
                  - message
                additionalProperties: true
                description: >-
                  Standard error envelope (matches AppError.toJSON output across
                  services).
  /longpolling/v1/consumers/{ispb}/{action}:
    servers: []
    post:
      summary: Start or cancel an ISPB consumer
      tags:
        - consumers
      description: >-
        Internal consumer management endpoint used by ops tooling to start or
        cancel the RabbitMQ consumer bound to a participant queue.
      parameters:
        - schema:
            type: string
            enum:
              - start
              - cancel
          in: path
          name: action
          required: true
        - schema:
            type: string
            minLength: 4
            maxLength: 8
          in: path
          name: ispb
          required: true
          description: Participant ISPB (4-8 char identifier).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Consumer transition acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
                description: Consumer transition acknowledged.
        '422':
          description: Consumer not found for the given ISPB.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  statusCode:
                    type: integer
                  message:
                    type: string
                required:
                  - error
                  - statusCode
                  - message
                additionalProperties: true
                description: Consumer not found for the given ISPB.
