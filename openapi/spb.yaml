openapi: 3.0.3
info:
  contact:
    email: contact@onz.software
    name: ONZ-Software
  description: >-
    API Gateway for the Brazilian Payment System (SPB) — REST façade for SPB
    operations (participant ↔ BACEN via IBM MQ, webhooks).
  license:
    name: Proprietary
  termsOfService: https://onz.software
  title: SPB API
  version: v0.161.0
tags:
  - description: Liveness / readiness probes.
    name: health
    x-displayName: health
  - description: Build / version info.
    name: version
    x-displayName: version
  - description: Private / public key material for SPB signing.
    name: certificates
    x-displayName: certificates
  - description: Institution balances (history + latest).
    name: balances
    x-displayName: balances
  - description: STR (Sistema de Transferência de Reservas) status.
    name: str
    x-displayName: str
  - description: >-
      Core SPB operations (create, approve, reject, reply, response, generate,
      get, list, analytics, audit-events).
    name: operations
    x-displayName: operations
  - description: Operation lifecycle events (list, get, document, requeue).
    name: events
    x-displayName: events
  - description: Transaction list / detail / receipt, CSV export and admin reprocess.
    name: transactions
    x-displayName: transactions
  - description: Stored file metadata listing and binary download.
    name: files
    x-displayName: files
  - description: SPB participant catalog (read-only listing).
    name: participants
    x-displayName: participants
  - description: Institution statements.
    name: statements
    x-displayName: statements
  - description: Audit-log read APIs.
    name: audit-events
    x-displayName: audit-events
  - name: longpolling
    description: Long-polling endpoint for consuming SPB responses.
    x-displayName: longpolling
  - name: consumers
    description: Per-ISPB consumer lifecycle management.
    x-displayName: consumers
paths:
  /api/v1/audit-events:
    servers:
      - url: /
    get:
      description: >-
        Paginated audit-log entries for the tenant, optionally filtered by
        period, actor, resource, action, operation, event or document.
      parameters:
        - description: 1-indexed page (default 1)
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - description: Page size (default 20, max 100)
          in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - description: Sort key
          in: query
          name: sort
          schema:
            type: string
            enum:
              - occurred_at_asc
              - occurred_at_desc
        - description: Start date (inclusive) YYYY-MM-DD
          in: query
          name: from
          schema:
            type: string
        - description: End date (inclusive) YYYY-MM-DD
          in: query
          name: to
          schema:
            type: string
        - description: Actor filter (exact match)
          in: query
          name: actor
          schema:
            type: string
        - description: Resource filter (exact match)
          in: query
          name: resource
          schema:
            type: string
        - description: Action filter (exact match)
          in: query
          name: action
          schema:
            type: string
        - description: Operation id filter
          in: query
          name: operation_id
          schema:
            type: string
        - description: Event id filter
          in: query
          name: event_id
          schema:
            type: string
        - description: Document id filter
          in: query
          name: document_id
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/types.DataQueryResponse-dto_AuditEventItem
        '400':
          description: Bad query parameters
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to list audit events
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List audit events (global)
      tags:
        - audit-events
  /api/v1/balances/history:
    servers:
      - url: /
    get:
      description: >-
        Paginated balance snapshots for a given period. Defaults to today when
        no query is supplied. Period must not exceed 30 days.
      parameters:
        - description: Start date (inclusive) YYYY-MM-DD
          example: '2026-04-01'
          in: query
          name: from
          schema:
            type: string
        - description: End date (inclusive) YYYY-MM-DD
          example: '2026-04-30'
          in: query
          name: to
          schema:
            type: string
        - description: 1-indexed page number (default 1)
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - description: Page size (default 3000)
          in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/types.DataQueryResponse-dto_BalanceSnapshotResponse
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '422':
          description: Unprocessable
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List balance history
      tags:
        - balances
  /api/v1/balances/latest:
    servers:
      - url: /
    get:
      description: >-
        Returns the most recent balance snapshot plus the projected balance and
        delta computed from STR reserve movements since the snapshot.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/str.balanceLatestResponse'
        '404':
          description: No balance snapshot found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Latest balance snapshot
      tags:
        - balances
  /api/v1/certificates:
    servers:
      - url: /
    get:
      deprecated: true
      description: Deprecated alias. Use /api/v1/admin/certificates.
      parameters:
        - description: 1-indexed page (default 1)
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - description: Page size (default 25, max 100)
          in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - description: Column to sort by (requires order)
          in: query
          name: sortBy
          schema:
            type: string
        - description: Sort order
          in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: OK
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/types.DataQueryResponse-dto_CertificateListItem
        '400':
          description: Bad query parameters
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to list certificates
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List certificates
      tags:
        - certificates
  /api/v1/certificates/{id}:
    servers:
      - url: /
    get:
      deprecated: true
      description: Deprecated alias. Use /api/v1/admin/certificates/{id}.
      parameters:
        - description: Certificate ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CertificateListItem'
        '400':
          description: Invalid certificate id
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '404':
          description: Certificate not found
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to retrieve certificate
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get certificate
      tags:
        - certificates
  /api/v1/certificates/private-key:
    servers:
      - url: /
    post:
      deprecated: true
      description: Deprecated alias. Use /api/v1/admin/certificates/private-key.
      requestBody:
        $ref: '#/components/requestBodies/postApiV1AdminCertificatesPrivateKey'
      responses:
        '201':
          description: Certificate created
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
        '400':
          description: Invalid form data
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '415':
          description: Unsupported Media Type
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to create certificate
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Upload participant private key
      tags:
        - certificates
  /api/v1/certificates/public-key:
    servers:
      - url: /
    post:
      deprecated: true
      description: Deprecated alias. Use /api/v1/admin/certificates/public-key.
      requestBody:
        $ref: '#/components/requestBodies/postApiV1AdminCertificatesPublicKey'
      responses:
        '201':
          description: Certificate created (no content)
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
        '400':
          description: Invalid form data
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '415':
          description: Unsupported Media Type
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to create certificate
          headers:
            Deprecation:
              description: Always true on deprecated legacy routes.
              schema:
                type: string
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Upload participant public key
      tags:
        - certificates
  /api/v1/files:
    servers:
      - url: /
    get:
      description: >-
        Paginated list of stored file metadata (bucket / S3 key are never
        exposed). Supports period filtering via from/to (YYYY-MM-DD, max 31
        days) and the shared queryFilter[i][...] protocol.
      parameters:
        - description: 1-indexed page (default 1)
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - description: Page size (default 25, max 100)
          in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - description: Start date YYYY-MM-DD
          in: query
          name: from
          schema:
            type: string
        - description: End date YYYY-MM-DD
          in: query
          name: to
          schema:
            type: string
        - description: Column to sort by (requires order)
          in: query
          name: sortBy
          schema:
            type: string
        - description: Sort order
          in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.DataQueryResponse-dto_File'
        '400':
          description: Bad query parameters
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to list files
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List files
      tags:
        - files
  /api/v1/files/{id}/download:
    servers:
      - url: /
    get:
      description: >-
        Streams the file's binary content as an attachment (no presigned URL is
        exposed).
      parameters:
        - description: File ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File content stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid file id
          content:
            application/octet-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
        '404':
          description: File not found
          content:
            application/octet-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to download file
          content:
            application/octet-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
        '503':
          description: Files storage not configured
          content:
            application/octet-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Download file
      tags:
        - files
  /api/v1/operations:
    servers:
      - url: /
    get:
      description: >-
        Paginated list of operations with the standard query-filter protocol
        (same as /transactions).
      parameters:
        - description: 1-indexed page (default 1)
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - description: Page size (default 25, max 100)
          in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - description: Column to sort by (requires order)
          in: query
          name: sortBy
          schema:
            type: string
        - description: Sort order
          in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
        - description: Raw filter expression (advanced)
          in: query
          name: filter
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/types.DataQueryResponse-github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto_Operation
        '400':
          description: Bad query parameters
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Failed to list operations
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List operations
      tags:
        - operations
    post:
      description: >-
        Post a raw SPB XML event (SISMSG envelope). The event type is inferred
        from the body. Signature + idempotency enforced via headers.
      parameters:
        - description: Idempotency key
          in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
        - description: SPB message type
          in: header
          name: X-Message-Type
          required: true
          schema:
            type: string
        - description: >-
            Recipient ISPB (required for events that address a specific
            participant)
          in: header
          name: X-Recipient
          schema:
            type: string
        - description: Override operation domain (optional)
          in: header
          name: X-Domain
          schema:
            type: string
        - description: Wait for response up to N seconds; 0 for fire-and-forget (default 0)
          in: header
          name: X-Request-Timeout
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/Payload'
      responses:
        '200':
          description: Operation reached a terminal state within the timeout
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '201':
          description: Operation accepted (async)
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '206':
          description: Operation accepted, timeout hit before terminal state
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '400':
          description: Bad request / validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Create operation (raw XML)
      tags:
        - operations
  /api/v1/operations/{event_type}:
    servers:
      - url: /
    post:
      description: >-
        Post a typed payload (JSON or proprietary format) for the given
        event_type. The registry converts it to canonical SPB XML before
        processing.
      parameters:
        - description: Event type (e.g. SLB0001, STR0003)
          in: path
          name: event_type
          required: true
          schema:
            type: string
        - description: Idempotency key
          in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
        - description: SPB message type
          in: header
          name: X-Message-Type
          required: true
          schema:
            type: string
        - description: Recipient ISPB (when applicable)
          in: header
          name: X-Recipient
          schema:
            type: string
        - description: Override operation domain (optional)
          in: header
          name: X-Domain
          schema:
            type: string
        - description: Wait for response up to N seconds (default 0)
          in: header
          name: X-Request-Timeout
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/xml:
            schema:
              type: object
        description: Mapped payload (JSON or XML)
        required: true
      responses:
        '200':
          description: Operation reached a terminal state within the timeout
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '201':
          description: Operation accepted (async)
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '206':
          description: Operation accepted, timeout hit before terminal state
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '400':
          description: Bad request / validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Create operation (mapped payload)
      tags:
        - operations
  /api/v1/operations/{event_type}/generate:
    servers:
      - url: /
    post:
      description: >-
        Convert a mapped payload (JSON or proprietary format) for the given
        event_type into canonical SPB XML, without dispatching.
      parameters:
        - description: Event type (e.g. SLB0001, STR0003)
          in: path
          name: event_type
          required: true
          schema:
            type: string
        - description: SPB message type
          in: header
          name: X-Message-Type
          required: true
          schema:
            type: string
        - description: Recipient ISPB (when applicable)
          in: header
          name: X-Recipient
          schema:
            type: string
        - description: Override operation domain (optional)
          in: header
          name: X-Domain
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/xml:
            schema:
              type: string
        description: Mapped payload (JSON serialized or raw XML)
        required: true
      responses:
        '200':
          description: Canonical SPB XML
          content:
            application/xml:
              schema:
                type: string
        '400':
          description: Bad request / validation error
          content:
            application/xml:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/xml:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Preview operation XML (mapped)
      tags:
        - operations
  /api/v1/operations/{operation_id}:
    servers:
      - url: /
    get:
      description: Return the full operation detail (including its events) by ID.
      parameters:
        - description: Operation ID
          in: path
          name: operation_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '404':
          description: Not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get operation
      tags:
        - operations
  /api/v1/operations/{operation_id}/approve:
    servers:
      - url: /
    post:
      description: >-
        Approve an operation currently in `pending_approval` (moves it back into
        processing).
      parameters:
        - description: Operation ID
          in: path
          name: operation_id
          required: true
          schema:
            type: string
        - description: Operation domain (required by domain middleware)
          in: header
          name: X-Domain
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github_com_onz-software_onz-spb_internal_adapters_api_handlers_operation_dto.Operation
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '404':
          description: Not found
          content:
            application/json:
              schema:
                additionalProperties:
