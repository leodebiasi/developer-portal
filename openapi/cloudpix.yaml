      responses:
        '200':
          description: Default Response
  /v3/icom/pacs/008:
    post:
      summary: Envio de PACS.008
      tags:
        - ICOM
      description: Transferência de valores
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idConciliacaoRecebedor:
                  type: string
                  pattern: ^\w+$|^$
                  nullable: true
                valor:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                nomeUsuarioPagador:
                  type: string
                cpfCnpjUsuarioPagador:
                  type: string
                contaUsuarioPagador:
                  type: string
                  pattern: ^\d+$
                  maxLength: 20
                agenciaUsuarioPagador:
                  type: string
                  pattern: ^\d+$
                  maxLength: 4
                tipoContaUsuarioPagador:
                  type: string
                  enum:
                    - CACC
                    - SLRY
                    - SVGS
                    - TRAN
                participanteDoUsuarioPagador:
                  type: string
                  minLength: 8
                  maxLength: 8
                participanteDoUsuarioRecebedor:
                  type: string
                  minLength: 8
                  maxLength: 8
                cpfCnpjUsuarioRecebedor:
