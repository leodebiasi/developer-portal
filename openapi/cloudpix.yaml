                - cpfCnpj
                - contaUsuarioPagador
                - agenciaUsuarioPagador
                - tipoContaUsuarioPagador
                - participanteDoUsuarioPagador
                - participanteDoUsuarioRecebedor
                - cpfCnpjUsuarioRecebedor
                - contaUsuarioRecebedor
                - agenciaUsuarioRecebedor
                - tipoContaUsuarioRecebedor
                - formaDeIniciacao
                - finalidadeDaTransacao
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/icom/trck/002:
    post:
      summary: Envio de TRCK.002
      tags:
        - ICOM
      description: >-
        Reporta transferência escritural (book transfer / transação interna) ao
        BACEN via TRCK.002. Quando `tipoDaTransacaoReportada` é omitido, a API
        deriva `BOK1` (mesmo ISPB) ou `BOK2` (ISPBs distintos). Para formas de
        iniciação `DICT`, `QRDN`, `QRES`, `APDN`, `APES` ou `INIC`, o campo
        `idContaTransacional` (chave Pix) é obrigatório.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                situacaoDaTransacao:
                  type: string
                  enum:
                    - ACCC
                  default: ACCC
                idInstrucaoDevolucao:
                  $ref: '#/components/schemas/idFimAFim'
                idFimAFim:
                  $ref: '#/components/schemas/idFimAFim'
                formaDeIniciacao:
                  type: string
                  enum:
                    - APDN
                    - APES
                    - AUTO
                    - DICT
                    - INIC
                    - MANU
                    - QRDN
                    - QRES
                tipoDaTransacaoReportada:
                  type: string
                  enum:
                    - BOK1
                    - BOK2
                valor:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                dataHoraDaTransacao:
                  type: string
                  format: date-time
                cpfCnpjUsuarioPagador:
                  $ref: '#/components/schemas/cpfCnpj'
                contaUsuarioPagador:
                  type: string
                  pattern: ^\d+$
                  maxLength: 20
                agenciaUsuarioPagador:
                  type: string
                  pattern: ^\d+$
                  maxLength: 4
                  default: '0000'
                tipoContaUsuarioPagador:
                  type: string
                  enum:
                    - CACC
                    - OTHR
                    - SLRY
                    - SVGS
                    - TRAN
                participanteDoUsuarioPagador:
                  type: string
                  minLength: 8
                  maxLength: 8
                participanteDoUsuarioRecebedor:
                  type: string
                  minLength: 8
                  maxLength: 8
                cpfCnpjUsuarioRecebedor:
                  $ref: '#/components/schemas/cpfCnpj'
                contaUsuarioRecebedor:
                  type: string
                  pattern: ^\d+$
                  maxLength: 20
                agenciaUsuarioRecebedor:
                  type: string
                  pattern: ^\d+$
                  maxLength: 4
                  default: '0000'
                tipoContaUsuarioRecebedor:
                  type: string
                  enum:
                    - CACC
                    - OTHR
                    - SLRY
                    - SVGS
                    - TRAN
                idContaTransacional:
                  type: string
                  maxLength: 77
              required:
                - idFimAFim
                - formaDeIniciacao
                - valor
                - dataHoraDaTransacao
                - cpfCnpjUsuarioPagador
                - contaUsuarioPagador
                - tipoContaUsuarioPagador
                - participanteDoUsuarioPagador
                - participanteDoUsuarioRecebedor
                - cpfCnpjUsuarioRecebedor
                - contaUsuarioRecebedor
                - tipoContaUsuarioRecebedor
              additionalProperties: false
              allOf:
                - anyOf:
                    - properties:
                        formaDeIniciacao:
                          enum:
                            - AUTO
                            - MANU
                    - required:
                        - idContaTransacional
        required: true
      responses:
        '201':
          description: TRCK.002 registrada e enviada

