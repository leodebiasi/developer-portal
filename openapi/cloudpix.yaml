                  pattern: ^\d+$
                  maxLength: 20
                agenciaUsuarioRecebedor:
                  type: string
                  pattern: ^\d+$
                  maxLength: 4
                tipoContaUsuarioRecebedor:
                  type: string
                  enum:
                    - CACC
                    - SLRY
                    - SVGS
                    - TRAN
                informacoesEntreUsuarios:
                  type: string
                  default: ''
                idContaTransacional:
                  type: string
                formaDeIniciacao:
                  type: string
                  enum:
                    - MANU
                    - DICT
                    - INIC
                    - QRDN
                    - QRES
                    - QRPG
                finalidadeDaTransacao:
                  type: string
                  enum:
                    - IPAY
                    - GSCB
                    - OTHR
                modalidadeAgente:
                  type: string
                  enum:
                    - AGFSS
                    - AGTEC
                    - AGTOT
                prestadorDoServicoDeSaque:
                  type: string
                informacoesValor:
                  type: array
                  items:
                    type: object
                    properties:
                      valor:
                        type: number
                        exclusiveMinimum: true
                        minimum: 0
                      tipo:
                        type: string
                        enum:
                          - VLCP
                          - VLDN
                    required:
                      - valor
                      - tipo
                    additionalProperties: false
                tipoPrioridadePagamento:
                  type: string
                  enum:
                    - PAGPRI
                    - PAGFRD
                    - PAGAGD
                  default: PAGPRI
                endToEndID:
                  $ref: '#/components/schemas/cpfCnpj'
                cnpjIniciadorPagamento:
                  $ref: '#/components/schemas/cpfCnpj'
