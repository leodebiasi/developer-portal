                codigoDeErro:
                  type: string
                  enum:
                    - AB09
                    - AB03
                    - AC03
                    - AC06
                    - AC07
                    - AC14
                    - AG03
                    - AM02
                    - AM09
                    - BE01
                    - BE17
                    - CH11
                    - DS04
                    - DS24
                    - DT05
                    - RR04
                    - SL02
                    - ''
              required:
                - idInstrucaoOriginal
                - idFimAFimOriginal
                - situacaoDaTransacao
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/icom/pacs/004:
    post:
      summary: Envio de PACS.004
      tags:
        - ICOM
      description: Devolução de valores
      requestBody:
        content:
          application/json:
            schema:
              type: object
