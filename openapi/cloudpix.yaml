       ## ENDPOINT Referente ao MED 2.0 ##      

###############################################
  /v4/dict/funds-recovery/list:
    post:
      summary: Lista Recuperação de Valores
      tags:
        - DICT-MED 2.0
      description: Lista por período a recuperação de valores.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                InitialDate:
                  type: string
                  format: date-time
                FinalDate:
                  type: string
                  format: date-time
                Page:
                  type: number
                  default: 1
                PerPage:
                  type: number
                  maximum: 350
                  default: 10
                Filter:
                  type: string
                QueryFilter:
                  type: array
                  default: []
              additionalProperties: false
              required:
                - InitialDate
                - FinalDate
              example:
                {
                  "meta": {
                    "Total": 15,
                    "PerPage": 1,
                    "CurrentPage": 1,
                    "FirstPage": 1,
                    "LastPage": 15,
                    "NextPage": 2,
                    "PrevPage": null
                  }
                }
      responses:
        '200':
          description: Default Response
  /v4/dict/funds-recovery:
    post:
      summary: Criar uma Recuperação de Valores
      tags:
        - DICT-MED 2.0
      description: Criar uma Recuperação de Valores
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RootTransactionId:
                  type: string
                  description: Transação Raiz, reportada como fraudulenta.
                  minLength: 32
                  maxLength: 32
                SituationType:
                  type: string
                  description: Tipo de situação que deu origem à Recuperação de Valores.
                  enum: 
                    - SCAM
                    - ACCOUNT_TAKEOVER
                    - COERCION
                    - FRAUDULENT_ACCESS
                    - OTHER
                    - UNKNOWN
                ReportDetails:
                  type: string
                  description: Detalhes que possam ajudar o PSP contraparte na análise. Obrigatório caso SituationType=OTHER
                  maxLength: 2000
                ContactEmail:
                  type: string
                  format: email
                  description: E-mail para contato.
                  pattern: ^[a-z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$
                ContactPhone:
                  type: string
                  format: phone
                  description: Telefone para contato.
                  pattern: ^\+?[1-9]\d{1,14}$
                FlowType:
                  type: string
                  enum: 
                    - AUTOMATED
                    - INTERACTIVE
                MinTransactionAmount:
                  type: number
                  description: Valor mínimo da transação para ser incluída no grafo.
                  default: "200.00"                  
                MaxTransactions:
                  type: integer
                  description: Número máximo de transações a serem incluídas no grafo.
                  exclusiveMaximum: true
                  default: 500
                HopWindow:
                  type: string
                  description: Janela de tempo entre transação que entra em uma conta e transação que sai.
                  default: "PT24H"
                MaxHops: 
                  type: integer
                  description: Profundidade máxima do grafo.
                  exclusiveMinimum: true
                  default: 5
                  maximum: 10
              required:
                - RootTransactionId
                - SituationType
                - ContactEmail
                - ContactPhone
                - FlowType
                - MinTransactionAmount
                - MaxTransactions
                - HopWindow
                - MaxHops
              additionalProperties: false
              example:
                RootTransactionId: E123456782023010112345678901234
                SituationType: SCAM
                ReportDetails: Pagamento realizado após engenharia social.
                ContactEmail: fraude@exemplo.com
                ContactPhone: "+5511999999999"
                FlowType: AUTOMATED
                MinTransactionAmount: 200.00
                MaxTransactions: 500
                HopWindow: PT24H
                MaxHops: 5
        required: true
      responses:
        '200':
          description: Default Response
