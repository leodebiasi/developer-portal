openapi: 3.0.3
info:
  title: CloudPix API
  description: Neste documento estão disponíveis todas as informações relativas à interface de comunicação necessárias para efetuar transações e consultas ICOM, além de comunicação com o DICT no ambiente de gestão da ONZ PIX.<br>O endpoint deverá ser solicitado via e-mail <mail>suporte@onz.software</mail> informando o IP que será utilizado para ter acesso a API.<br>Para acessar a API é necessário estar com o Certificado Instalado (PFX) que será fornecido juntamente com o EndPoint.<br><br><b>Importante:</b> Informamos que todos os requests com excessão do login, necessitam conter o parâmetro `ONZ-Token` no header, caso contrário a API retornará o Status `401 - Unauthorized`.
  version: ''
servers: []
tags:
  - name: ICOM
    description: Requests para interação com a Interface de Comunicação (ICOM)
  - name: DICT-Chaves
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Estatísticas
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-QRCodes
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Antifraude
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Infrações
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-MED 2.0
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Notificações de Eventos
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Devoluções
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Reconciliações
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: DICT-Reivindicações
    description: Requests para interação com o Diretório de Identificadores de Contas Transacionais (DICT)
  - name: Legado
    description: Endpoints legados
components:
  schemas:
    cpfCnpj:
      type: string
      pattern: ^[0-9]{11,14}$
    idFimAFim:
      type: string
      pattern: /[E|D][0-9]{8}[0-9]{4}[0-1][0-9][0-3][0-9][0-2][0-9][0-5][0-9][a-zA-Z0-9]{11}/
    onz-payerid:
      type: string
      pattern: ^[0-9]{11,14}$
paths:
  /v3/qrcode/checkBrCode:
    post:
      summary: Consulta de QRCode
      tags:
        - DICT-QRCodes
      description: Realiza a consulta de um QRCode através do código BRCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brCode:
                  type: string
                codMun:
                  type: string
                  minLength: 7
                  maxLength: 7
                DPP:
                  type: string
                  default: '2024-02-05'
              required:
                - brCode
                - codMun
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
          in: header
          name: onz-payerid
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/{key}:
    get:
      summary: Buscar Chave Pix
      tags:
        - DICT-Chaves
      description: Obtém os detalhes de uma chave Pix
      parameters:
        - schema:
            anyOf:
              - type: string
              - type: string
                pattern: ^\+[1-9]\d\d{1,14}$
              - type: string
                pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
              - type: string
                format: uuid
          in: path
          name: key
          required: true
        - schema:
            type: string
          in: header
          name: onz-payerid
          required: true
        - schema:
            $ref: '#/components/schemas/onz-payerid'
          in: header
          name: onz-endtoendid
          required: false
        - schema:
            type: boolean
            default: false
          in: header
          name: onz-includestatistics
          required: false
      responses:
        '200':
          description: Default Response
    put:
      summary: Atualizar Chave Pix
      tags:
        - DICT-Chaves
      description: Realiza a atualização dos dados de uma chave Pix
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Type:
                  type: string
                  enum:
                    - NATURAL_PERSON
                    - LEGAL_PERSON
                TaxIdNumber:
                  type: string
                Name:
                  type: string
                TradeName:
                  type: string
                Branch:
                  type: string
                  pattern: ^\d+$
                  minLength: 4
                  maxLength: 4
                AccountNumber:
                  type: string
                  pattern: ^\d+$
                  minLength: 1
                  maxLength: 20
                AccountType:
                  type: string
                  enum:
                    - SLRY
                    - SVGS
                    - CACC
                    - TRAN
                OpeningDate:
                  type: string
                Reason:
                  type: string
                  enum:
                    - USER_REQUESTED
                    - BRANCH_TRANSFER
                    - RECONCILIATION
              required:
                - Reason
              additionalProperties: false
        required: true
      parameters:
        - schema:
            anyOf:
              - type: string
              - type: string
                pattern: ^\+[1-9]\d\d{1,14}$
              - type: string
                pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
              - type: string
                format: uuid
          in: path
          name: key
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/conta/{agency}/{account}:
    get:
      summary: Buscar Chave Pix por Agência e Conta
      tags:
        - DICT-Chaves
      description: Realiza a busca de uma chave Pix no ambiente do DICT por agência e conta
      parameters:
        - schema:
            type: string
            pattern: ^\d+$
            minLength: 4
            maxLength: 4
          in: path
          name: agency
          required: true
        - schema:
            type: string
            pattern: ^\d+$
            minLength: 1
            maxLength: 20
          in: path
          name: account
          required: true
        - schema:
            type: string
          in: header
          name: onz-payerid
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/politicas/{policy}:
    get:
      summary: Consultar Política
      tags:
        - DICT-Chaves
      description: Obtém o estado atual do balde do participante para a política informada.
      parameters:
        - schema:
            type: string
            maxLength: 256
          in: path
          name: policy
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/politicas:
    get:
      summary: Listar Políticas
      tags:
        - DICT-Chaves
      description: Obtém a lista de políticas de limitação de acesso ao DICT para o participante requisitante.
      responses:
        '200':
          description: Default Response
  /v3/dict/chave:
    post:
      summary: Criar Chave Pix
      tags:
        - DICT-Chaves
      description: Cria uma nova chave Pix no ambiente do DICT.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Key:
                  anyOf:
                    - type: string
                    - type: string
                      pattern: ^\+[1-9]\d\d{1,14}$
                    - type: string
                      pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                    - type: string
                      format: uuid
                KeyType:
                  type: string
                  enum:
                    - CPF
                    - CNPJ
                    - PHONE
                    - EMAIL
                    - EVP
                Branch:
                  type: string
                  pattern: ^\d+$
                  minLength: 4
                  maxLength: 4
                AccountNumber:
                  type: string
                  pattern: ^\d+$
                  minLength: 1
                  maxLength: 20
                AccountType:
                  type: string
                  enum:
                    - SLRY
                    - SVGS
                    - CACC
                    - TRAN
                Type:
                  type: string
                  enum:
                    - LEGAL_PERSON
                    - NATURAL_PERSON
                OpeningDate:
                  type: string
                  format: date-time
                Name:
                  type: string
                  minLength: 1
                  maxLength: 120
                TradeName:
                  type: string
                  maxLength: 100
                TaxIdNumber:
                  $ref: '#/components/schemas/cpfCnpj'
                Reason:
                  type: string
                  enum:
                    - USER_REQUESTED
                    - RECONCILIATION
              required:
                - KeyType
                - Branch
                - AccountNumber
                - AccountType
                - Type
                - OpeningDate
                - Name
                - TaxIdNumber
                - Reason
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/list:
    post:
      summary: Listar Chaves Pix
      tags:
        - DICT-Chaves
      description: Listar as chaves Pix cadastradas para o usuário
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Page:
                  type: number
                  default: 1
                PerPage:
                  type: number
                  maximum: 350
                  default: 10
                Filter:
                  type: string
                QueryFilter:
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                      operation:
                        type: string
                        enum:
                          - ILIKE
                          - NOT_ILIKE
                          - HIGHER
                          - LOWER
                          - EQUALS
                          - NOT_EQUALS
                          - AFTER_DATE
                          - BEFORE_DATE
                          - EQUALS_DATE
                          - AFTER_DATETIME
                          - BEFORE_DATETIME
                          - EQUALS_DATETIME
                      value:
                        anyOf:
                          - type: string
                          - type: number
                    required:
                      - column
                      - operation
                      - value
                    additionalProperties: false
                  default: []
                ExportCSV:
                  type: boolean
                InitialDate:
                  type: string
                  format: date-time
                FinalDate:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/existencia:
    post:
      summary: Verificar existência de chaves
      tags:
        - DICT-Chaves
      description: Consulta a existência de um conjunto de chaves no diretório de identificadores.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Keys:
                  type: array
                  items:
                    type: object
                    properties:
                      Key:
                        anyOf:
                          - type: string
                          - type: string
                            pattern: ^\+[1-9]\d\d{1,14}$
                          - type: string
                            pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                          - type: string
                            format: uuid
                    required:
                      - Key
                    additionalProperties: false
              required:
                - Keys
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/chave/{key}/{reason}:
    delete:
      summary: Deletar Chave Pix
      tags:
        - DICT-Chaves
      description: Realiza a exclusão de uma chave Pix
      parameters:
        - schema:
            anyOf:
              - type: string
              - type: string
                pattern: ^\+[1-9]\d\d{1,14}$
              - type: string
                pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
              - type: string
                format: uuid
          in: path
          name: key
          required: true
        - schema:
            type: string
            enum:
              - USER_REQUESTED
              - ACCOUNT_CLOSURE
              - BRANCH_TRANSFER
              - RECONCILIATION
              - FRAUD
          in: path
          name: reason
          required: true
        - schema:
            type: string
          in: header
          name: onz-taxidnumber
          required: false
      responses:
        '200':
          description: Default Response
  /v3/dict/devolucao/{id}:
    get:
      summary: Consultar solicitação de devolução
      tags:
        - DICT-Devoluções
      description: Obtém detalhes de uma solicitação de devolução.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/devolucao:
    post:
      summary: Criar uma Solicitação de Devolução
      tags:
        - DICT-Devoluções
      description: Cria uma Solicitação de devolução. Apenas o participante debitado pode criar uma Solicitação de devolução.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                TransactionId:
                  type: string
                RefundReason:
                  type: string
                  enum:
                    - FRAUD
                    - OPERATIONAL_FLAW
                    - REFUND_CANCELLED
                RefundAmount:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                RefundDetails:
                  type: string
                  maxLength: 2000
              required:
                - TransactionId
                - RefundReason
                - RefundAmount
                - RefundDetails
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/devolucao/{id}/cancelar:
    post:
      summary: Cancelar solicitação de devolução
      tags:
        - DICT-Devoluções
      description: Cancela a Solicitação de devolução. Só pode ser realizada pelo participante que criou a solicitação.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/devolucao/{id}/fechar:
    post:
      summary: Fechar solicitação de devolução
      tags:
        - DICT-Devoluções
      description: Fecha a solicitação de devolução. A solicitação só pode ser fechada pelo participante contestado.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RefundAnalysisResult:
                  type: string
                  enum:
                    - TOTALLY_ACCEPTED
                    - PARTIALLY_ACCEPTED
                    - REJECTED
                RefundAnalysisDetails:
                  type: string
                  maxLength: 2000
                RefundTransactionId:
                  type: string
                RefundRejectionReason:
                  type: string
                  enum:
                    - NO_BALANCE
                    - ACCOUNT_CLOSURE
                    - CANNOT_REFUND
                    - OTHER
                EffectiveRefundedAmount:
                  type: number
                  format: currency
                  description: |
                    Valor efetivamente devolvido.
                    Obs: Utilizado apenas no contexto de Recuperação de Valores.
              required:
                - RefundAnalysisResult
                - EffectiveRefundedAmount
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/devolucao/list:
    post:
      summary: Listar Requisições de Devolução
      tags:
        - DICT-Devoluções
      description: Obtém lista de requisições de devolução em que o participante é parte.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Page:
                  type: number
                  default: 1
                PerPage:
                  type: number
                  maximum: 350
                  default: 10
                Filter:
                  type: string
                QueryFilter:
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                      operation:
                        type: string
                        enum:
                          - ILIKE
                          - NOT_ILIKE
                          - HIGHER
                          - LOWER
                          - EQUALS
                          - NOT_EQUALS
                          - AFTER_DATE
                          - BEFORE_DATE
                          - EQUALS_DATE
                          - AFTER_DATETIME
                          - BEFORE_DATETIME
                          - EQUALS_DATETIME
                      value:
                        anyOf:
                          - type: string
                          - type: number
                    required:
                      - column
                      - operation
                      - value
                    additionalProperties: false
                  default: []
                ExportCSV:
                  type: boolean
                InitialDate:
                  type: string
                  format: date-time
                FinalDate:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        '200':
          description: Default Response
  /v3/dict/reivindicacao/{id}:
    get:
      summary: Consultar Reivindicação
      tags:
        - DICT-Reivindicações
      description: Obtém detalhes de uma reivindicação.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Sucesso na consulta da reivindicação
          content:
            application/json:
              schema:
                type: object
                properties:
                  Id:
                    type: string
                    format: uuid
                  Type:
                    type: string
                    enum: [PORTABILITY, OWNERSHIP]
                  Key:
                    type: string
                  KeyType:
                    type: string
                    enum: [CNPJ, CPF, EMAIL, PHONE, EVP]
                  ClaimerParticipant:
                    type: string
                  ClaimerBranch:
                    type: string
                  ClaimerAccountNumber:
                    type: string
                  ClaimerAccountType:
                    type: string
                    enum: [TRAN, CACC, SLRY, SVGS]
                  ClaimerOpeningDate:
                    type: string
                    format: date-time
                  ClaimerType:
                    type: string
                    enum: [LEGAL_PERSON, NATURAL_PERSON]
                  ClaimerTaxIdNumber:
                    type: string
                  ClaimerName:
                    type: string
                  Status:
                    type: string
                    enum:
                      [
                        OPEN,
                        COMPLETED,
                        CANCELLED,
                        CONFIRMED,
                        WAITING_RESOLUTION,
                      ]
                  CompletionPeriodEnd:
                    type: string
                    format: date-time
                    nullable: true
                  ResolutionPeriodEnd:
                    type: string
                    format: date-time
                    nullable: true
                  DonorParticipant:
                    type: string
                  DonorBranch:
                    type: string
                  DonorAccountNumber:
                    type: string
                  DonorAccountType:
                    type: string
                    enum: [TRAN, CACC, SLRY, SVGS]
                  DonorOpeningDate:
                    type: string
                    format: date-time
                  DonorType:
                    type: string
                    enum: [LEGAL_PERSON, NATURAL_PERSON]
                  DonorTaxIdNumber:
                    type: string
                  DonorName:
                    type: string
                  RelatedParticipant:
                    type: string
                  LastModified:
                    type: string
                    format: date-time
                  CreatedAt:
                    type: string
                    format: date-time
                  UpdatedAt:
                    type: string
                    format: date-time
                  ParticipantName:
                    type: string
                  ParticipantNameDonor:
                    type: string
                  IsInternalToExternal:
                    type: boolean
                  isClaimer:
                    type: boolean

  /v3/dict/reivindicacao/{id}/confirmar:
    post:
      summary: Confirmar Reivindicação
      tags:
        - DICT-Reivindicações
      description: Confirma a operação de reivindicação. Como consequência, vínculo da chave com participante doador é removido.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Reason:
                  type: string
                  enum:
                    - USER_REQUESTED
                    - ACCOUNT_CLOSURE
                    - FRAUD
                    - DEFAULT_OPERATION
                    - RECONCILIATION
              required:
                - Reason
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/reivindicacao/{id}/cancelar:
    post:
      summary: Cancelar Reivindicação
      tags:
        - DICT-Reivindicações
      description: Cancela reivindicação.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Reason:
                  type: string
                  enum:
                    - USER_REQUESTED
                    - ACCOUNT_CLOSURE
                    - FRAUD
                    - DEFAULT_OPERATION
                    - RECONCILIATION
              required:
                - Reason
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/reivindicacao:
    post:
      summary: Criar Reivindicação
      tags:
        - DICT-Reivindicações
      description: Cria uma nova reivindicação.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Key:
                  anyOf:
                    - type: string
                    - type: string
                      pattern: ^\+[1-9]\d\d{1,14}$
                    - type: string
                      pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                    - type: string
                      format: uuid
                KeyType:
                  type: string
                  enum:
                    - CPF
                    - CNPJ
                    - PHONE
                    - EMAIL
                    - EVP
                Branch:
                  type: string
                  pattern: ^\d{4}$
                AccountNumber:
                  type: string
                  pattern: ^\d{1,20}$
                AccountType:
                  type: string
                  enum:
                    - CACC
                    - TRAN
                    - SLRY
                    - SVGS
                OpeningDate:
                  type: string
                ClaimerType:
                  type: string
                  enum:
                    - NATURAL_PERSON
                    - LEGAL_PERSON
                Type:
                  type: string
                  enum:
                    - OWNERSHIP
                    - PORTABILITY
                TaxIdNumber:
                  anyOf:
                    - type: string
                      pattern: ^\d+$
                      minLength: 11
                      maxLength: 11
                    - type: string
                      pattern: ^\d+$
                      minLength: 14
                      maxLength: 14
                Name:
                  type: string
              required:
                - Key
                - KeyType
                - Branch
                - AccountNumber
                - AccountType
                - OpeningDate
                - ClaimerType
                - Type
                - TaxIdNumber
                - Name
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/reivindicacao/list:
    post:
      summary: Listar Reivindicações
      tags:
        - DICT-Reivindicações
      description: Obtém uma lista de reivindicações, ordenada de forma crescente pelo campo `LastModified`, de acordo com os filtros passados.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Page:
                  type: number
                  default: 1
                PerPage:
                  type: number
                  maximum: 350
                  default: 25
                Filter:
                  type: string
                QueryFilter:
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                      operation:
                        type: string
                        enum:
                          - ILIKE
                          - NOT_ILIKE
                          - HIGHER
                          - LOWER
                          - EQUALS
                          - NOT_EQUALS
                          - AFTER_DATE
                          - BEFORE_DATE
                          - EQUALS_DATE
                          - AFTER_DATETIME
                          - BEFORE_DATETIME
                          - EQUALS_DATETIME
                      value:
                        anyOf:
                          - type: string
                          - type: number
                    required:
                      - column
                      - operation
                      - value
                    additionalProperties: false
                  default: []
              additionalProperties: false
      responses:
        '200':
          description: Default Response
  /v3/dict/infracao/{id}:
    get:
      summary: Consultar Relato de Infração
      tags:
        - DICT-Infrações
      description: >-
        Obtém detalhes de um relato de infração. Quando a infração foi fechada
        com AnalysisResult=AGREED, a resposta inclui FraudMarkerId (UUID da
        marcação de fraude gerada automaticamente pelo DICT). Use esse ID em
        GET /v4/dict/antifraud/fraud-markers/{FraudMarkerId}.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: >-
            Detalhes da infração. Pode incluir FraudMarkerId quando houver
            marcação automática vinculada (fecho AGREED).
  /v3/dict/infracao:
    post:
      summary: Criar Relato de Infração
      tags:
        - DICT-Infrações
      description: Cria um relato de infração. Tanto o participante debitado quanto o creditado podem criar um relato de infração.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                TransactionId:
                  type: string
                ReportDetails:
                  type: string
                  maxLength: 2000
                InfractionType:
                  type: string
                  enum:
                    - REFUND_REQUEST
                    - REFUND_CANCELLED
                SituationType:
                  type: string
                  enum:
                    - SCAM
                    - ACCOUNT_TAKEOVER
                    - COERCION
                    - FRAUDULENT_ACCESS
                    - OTHER
                Phone:
                  type: string
                  pattern: ^\+[0-9]\d{1,14}$
                  maxLength: 16
                Email:
                  type: string
                  pattern: ^[a-z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$
                  maxLength: 256
              required:
                - TransactionId
                - ReportDetails
                - InfractionType
                - SituationType
                - Phone
                - Email
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/infracao/list:
    post:
      summary: Listar Relatos de Infração
      tags:
        - DICT-Infrações
      description: Obtém lista de relatos de infração em que o participante é parte.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Page:
                  type: number
                  default: 1
                PerPage:
                  type: number
                  maximum: 350
                  default: 10
                Filter:
                  type: string
                QueryFilter:
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                      operation:
                        type: string
                        enum:
                          - ILIKE
                          - NOT_ILIKE
                          - HIGHER
                          - LOWER
                          - EQUALS
                          - NOT_EQUALS
                          - AFTER_DATE
                          - BEFORE_DATE
                          - EQUALS_DATE
                          - AFTER_DATETIME
                          - BEFORE_DATETIME
                          - EQUALS_DATETIME
                      value:
                        anyOf:
                          - type: string
                          - type: number
                    required:
                      - column
                      - operation
                      - value
                    additionalProperties: false
                  default: []
                ExportCSV:
                  type: boolean
                InitialDate:
                  type: string
                  format: date-time
                FinalDate:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        '200':
          description: Default Response
  /v3/dict/infracao/{id}/fechar:
    post:
      summary: Fechar Relato de Infração
      tags:
        - DICT-Infrações
      description: >-
        Fecha o relato de infração. Se o relato foi criado pelo participante
        debitado, o creditado deve realizar o fechamento e vice-versa. O campo
        FraudType é obrigatório quando o relato é fechado com o resultado
        AGREED. Ao fechar como AGREED (fluxo MED / solicitação de devolução),
        o DICT gera automaticamente uma marcação de fraude e a resposta inclui
        FraudMarkerId (UUID) para consulta em
        GET /v4/dict/antifraud/fraud-markers/{FraudMarkerId}.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                AnalysisDetails:
                  type: string
                  maxLength: 2000
                AnalysisResult:
                  type: string
                  enum:
                    - AGREED
                    - DISAGREED
                FraudType:
                  type: string
                  enum:
                    - APPLICATION_FRAUD
                    - MULE_ACCOUNT
                    - SCAMMER_ACCOUNT
                    - OTHER
              required:
                - AnalysisDetails
                - AnalysisResult
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: >-
            Infração fechada. Quando AnalysisResult=AGREED, inclui FraudMarkerId
            com o UUID da marcação de fraude gerada automaticamente pelo DICT.
  /v3/dict/infracao/{id}/cancelar:
    post:
      summary: Cancelar Relato de Infração
      tags:
        - DICT-Infrações
      description: Cancela o relato de infração. Só pode ser realizada pelo participante que criou o relato.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v3/dict/estatisticas/{document}:
    get:
      summary: Consultar Estatísticas de usuário final
      tags:
        - DICT-Estatísticas
      description: Obtém dados estatísticos de perfil de uso do usuário (liquidações, fraudes reportadas e fraudes confirmadas).
      parameters:
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          in: query
          name: date
          required: false
        - schema:
            type: string
          in: path
          name: document
          required: true
      responses:
        '200':
          description: Default Response
  /v3/lp/{pullNext}:
    get:
      summary: Long Polling
      tags:
        - ICOM
      description: |
        Serviço de long polling para consulta de mensagens recebidas. <br>
        O primeiro `pullNext` deve ser obriatóriamente `start`. <br>
        As consultas subsequentes devem usar o token recebido no header `ONZ-Pull-Next` da resposta anterior.
      parameters:
        - schema:
            type: string
          in: path
          name: pullNext
          required: true
          description: Token de continuação do long polling (usar "start" na primeira chamada)
      responses:
        '200':
          description: Mensagens disponíveis
          headers:
            ONZ-Pull-Next:
              schema:
                type: string
              description: Token para a próxima consulta via long polling
        '204':
          description: Nenhuma mensagem disponível
          headers:
            ONZ-Pull-Next:
              schema:
                type: string
              description: Token para a próxima consulta via long polling
  /v3/icom/pacs/002:
    post:
      summary: Envio de PACS.002
      tags:
        - ICOM
      description: Resposta para as mensagens PACS.008 e PACS.004
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idInstrucaoOriginal:
                  type: string
                idFimAFimOriginal:
                  $ref: '#/components/schemas/idFimAFim'
                situacaoDaTransacao:
                  type: string
                  enum:
