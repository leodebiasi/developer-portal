  /v4/dict/antifraud/fraud-markers:
    post:
      summary: Criar Marcação de Fraude
      tags:
        - DICT-Antifraude
      description: >-
        Cria uma marcação de fraude para um usuário ou chave específica. O
        identificador da marcação (RequestId) é gerado automaticamente pelo
        backend e retornado na resposta. Não envie RequestId no corpo da
        requisição: campos extras são rejeitados com 400 Validation Error.
        Observação: ao fechar uma infração MED como AGREED, o DICT gera a
        marcação automaticamente — nesse caso o FraudMarkerId vem no response
        do fechamento/consulta da infração e não precisa ser criado via este
        endpoint.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                FraudMarker:
                  type: object
                  properties:
                    TaxIdNumber:
                      type: string
                      description: CPF/CNPJ do usuário marcado
                    FraudType:
                      type: string
                      enum:
                        - APPLICATION_FRAUD
                        - MULE_ACCOUNT
                        - SCAMMER_ACCOUNT
                        - OTHER
                        - UNKNOWN
                    Key:
                      type: string
                      maxLength: 77
                      description: Chave PIX associada à fraude (opcional)
                  required:
                    - TaxIdNumber
                    - FraudType
              required:
                - FraudMarker
      responses:
        '200':
          description: >-
            Marcação de fraude criada com sucesso. O campo RequestId da
            resposta contém o identificador da marcação gerado pelo backend.
        '400':
          description: Requisição inválida
        '403':
          description: Acesso negado
        '503':
          description: Serviço indisponível

  /v4/dict/antifraud/fraud-markers/{FraudMarkerId}:
    get:
      summary: Consultar Marcação de Fraude
      tags:
        - DICT-Antifraude
      description: >-
        Obtém detalhes de uma marcação de fraude específica. Marcações geradas
        automaticamente ao fechar uma infração MED como AGREED também são
        consultáveis por este endpoint; o FraudMarkerId é o mesmo retornado no
        fechamento/consulta da infração (e como RequestId na criação manual).
      parameters:
        - name: FraudMarkerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da marcação de fraude
        '404':
          description: Marcação não encontrada

  /v4/dict/antifraud/fraud-markers/{FraudMarkerId}/cancel:
    post:
      summary: Cancelar Marcação de Fraude
      tags:
        - DICT-Antifraude
      description: Cancela uma marcação de fraude existente.
      parameters:
        - name: FraudMarkerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marcação de fraude cancelada com sucesso
        '403':
          description: Acesso negado
        '404':
          description: Marcação não encontrada
        '503':
          description: Serviço indisponível

  /v4/dict/antifraud/statistics/persons/{TaxIdNumber}:
    get:
      summary: Consultar Estatísticas de Pessoa
      tags:
        - DICT-Antifraude
      description: Obtém dados estatísticos de um usuário final.
      parameters:
        - name: TaxIdNumber
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{11,14}$
      responses:
        '200':
          description: Estatísticas do usuário
        '403':
          description: Acesso negado
        '503':
          description: Serviço indisponível

  /v4/dict/antifraud/statistics/entries/{Key}:
    get:
      summary: Consultar Estatísticas de Chave Registrada
      tags:
        - DICT-Antifraude
      description: Obtém dados estatísticos relacionados a uma chave registrada.
      parameters:
        - name: Key
          in: path
          required: true
          schema:
            type: string
            maxLength: 77
      responses:
        '200':
          description: Estatísticas da chave
        '403':
          description: Acesso negado
        '503':
          description: Serviço indisponível

